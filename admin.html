<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aula Siurot · Maestro</title>
<meta name="theme-color" content="#0f2557">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='42' fill='%23ff8a1f'/%3E%3Ccircle cx='36' cy='48' r='10' fill='%23fff'/%3E%3Ccircle cx='64' cy='48' r='10' fill='%23fff'/%3E%3Ccircle cx='36' cy='49' r='5' fill='%2314234a'/%3E%3Ccircle cx='64' cy='49' r='5' fill='%2314234a'/%3E%3Cpath d='M36 70q14 12 28 0' stroke='%2314234a' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="apple-touch-icon" href="icono-admin-180.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Aula Siurot">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Base común ===== */
:root{
 --noche:#0f2557;--azul:#1e4fa3;--azulv:#2f6fe0;--tinta:#14234a;--tinta2:#4a5a85;--nube:#f3f6ff;--nube2:#e8eefc;--linea:#dbe3f7;
 --naranja:#ff8a1f;--naranja2:#f06a00;--verde:#1f9d55;--verde2:#e3f7ea;--rojo:#e5484d;--rojo2:#fdeaea;--oro:#ffc21a;--blanco:#fff;
 --r1:12px;--r2:18px;--r3:26px;--sombra:0 10px 30px rgba(15,37,87,.18);--sombra2:0 2px 0 rgba(20,35,74,.08);
 --f-tit:"Baloo 2","Nunito",system-ui,sans-serif;--f-txt:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:#163a80}
body{font-family:var(--f-txt);color:var(--tinta);background:linear-gradient(160deg,var(--noche),var(--azul)) fixed;min-height:100vh;min-height:100dvh;font-size:16px;line-height:1.4}
h1,h2,h3{font-family:var(--f-tit);line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azulv);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:800;font-size:15px;line-height:1.1;background:var(--nube2);color:var(--tinta);transition:transform .12s,filter .12s,background .15s;min-height:44px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.pri{background:linear-gradient(180deg,#ff9d3d,var(--naranja2));color:#fff;box-shadow:0 3px 0 #c45400,0 6px 14px rgba(240,106,0,.3)}
.btn.sec{background:var(--nube2);color:var(--tinta)}
.btn.azul{background:linear-gradient(180deg,#4b8bff,#1f5fd6);color:#fff;box-shadow:0 3px 0 #1846a3}
.btn.verde{background:linear-gradient(180deg,#34c06c,#178a46);color:#fff;box-shadow:0 3px 0 #0f6a34}
.btn.peligro{background:var(--rojo);color:#fff;box-shadow:0 3px 0 #a92e32}
.btn.fant{background:transparent;color:inherit}
.btn.fant:hover{background:rgba(127,150,210,.15)}
.btn.chico{min-height:34px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.icono{width:44px;padding:0}
.btn.icono.chico{width:34px}

/* Campos */
.campo{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.campo>span{font-weight:800;font-size:14px;color:var(--tinta2)}
.campo input,.campo select,.campo textarea,.inp{border:2px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus,.inp:focus{border-color:var(--azulv);outline:0}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fila>.campo{flex:1;min-width:120px}
.interruptor{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.interruptor input{appearance:none;width:46px;height:28px;border-radius:99px;background:#cdd6ee;position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.interruptor input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}
.interruptor input:checked{background:var(--verde)}
.interruptor input:checked::after{transform:translateX(18px)}

/* Escena (fondo + monstruo) */
.escena{position:relative;overflow:hidden;isolation:isolate}
.escena>.fondo{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.escena>.mon{position:relative;width:100%;height:100%}

/* Modales */
.velo{position:fixed;inset:0;background:rgba(9,20,52,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;opacity:0;transition:opacity .2s}
.velo.on{opacity:1}
.modal{background:#fff;border-radius:var(--r3);box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;transform:translateY(18px) scale(.98);transition:transform .22s cubic-bezier(.3,1.3,.5,1);overflow:hidden}
.velo.on .modal{transform:none}
.modal.pequeña{width:min(420px,100%)}
.modal.grande{width:min(860px,100%)}
.m-cab{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.m-cab h2{font-size:22px;flex:1}
.m-x{border:0;background:var(--nube2);width:38px;height:38px;border-radius:50%;font-size:16px;font-weight:800;flex:none}
.m-cuerpo{padding:8px 18px 14px;overflow:auto;flex:1;overscroll-behavior:contain}
.m-pie{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 18px;border-top:1px solid var(--nube2);flex-wrap:wrap}
.m-texto{margin:4px 0 6px;font-size:17px}
@media(max-width:620px){
 .velo{align-items:flex-end;padding:0}
 .modal{border-radius:24px 24px 0 0;max-height:92vh;max-height:92dvh;width:100%!important;transform:translateY(40px)}
 .m-pie{padding-bottom:max(18px,env(safe-area-inset-bottom))}
 .m-pie .btn{flex:1}
}

/* Avisos */
#toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:200;width:min(94vw,520px);pointer-events:none}
.toast{pointer-events:auto;background:var(--tinta);color:#fff;border-radius:16px;padding:10px 12px 10px 16px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;transition:.25s;max-width:100%}
.toast.on{transform:none;opacity:1}
.toast span{flex:1;display:flex;gap:8px;align-items:center}
.toast .t-ic{font-size:20px}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;border-radius:10px;padding:7px 12px}
.toast.ok{background:#14603a}.toast.error{background:#a32a2e}

/* Burbuja de puntos */
.burbuja-pts{position:fixed;transform:translate(-50%,-50%);font:800 34px var(--f-tit);color:#fff;pointer-events:none;z-index:150;animation:subir 1.3s ease-out forwards;padding:2px 14px;border-radius:99px;background:var(--verde);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.burbuja-pts.neg{background:var(--rojo)}
.burbuja-pts.oro{background:linear-gradient(180deg,#ffd34d,#f2a200);color:#5a3a00}
@keyframes subir{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:300}

/* Varios */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;background:var(--nube2);white-space:nowrap}
.chip.ok{background:var(--verde2);color:#14603a}.chip.mal{background:var(--rojo2);color:#a32a2e}.chip.oro{background:#fff1c7;color:#7a5200}
.seg{display:inline-flex;background:var(--nube2);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:800;color:var(--tinta2);min-height:36px}
.seg button[aria-pressed=true]{background:#fff;color:var(--tinta);box-shadow:var(--sombra2)}
.vacio{text-align:center;color:var(--tinta2);padding:28px 12px}
.vacio b{display:block;font-family:var(--f-tit);font-size:20px;color:var(--tinta);margin-bottom:4px}
.barra{height:14px;border-radius:99px;background:var(--nube2);overflow:hidden;position:relative}
.barra>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffb347,var(--naranja));transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.cargando{display:grid;place-items:center;min-height:60vh;color:#fff;font:800 20px var(--f-tit)}
.cargando i{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:var(--naranja);animation:gira 1s linear infinite;margin:0 auto 12px;display:block}
@keyframes gira{to{transform:rotate(360deg)}}
.demo-aviso{background:#fff1c7;color:#6b4800;font-weight:700;font-size:13px;text-align:center;padding:6px 12px}
.demo-aviso button{border:0;background:transparent;text-decoration:underline;font-weight:800;color:inherit;padding:0 4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#instalar{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:10px 16px;font:800 14px/1 'Nunito',system-ui,sans-serif;color:#fff;background:linear-gradient(135deg,#ff9a3d,#e8590c);box-shadow:0 6px 18px rgba(232,89,12,.45);cursor:pointer;animation:instPop .5s cubic-bezier(.3,1.5,.5,1)}
#instalar:hover{filter:brightness(1.08)}
@keyframes instPop{from{transform:translateY(30px) scale(.8);opacity:0}}
@media print{#instalar{display:none}}

body:has(#compra) #instalar,body:has(.modal-fondo) #instalar{display:none}

#instalar-ban{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:70;width:min(560px,calc(100vw - 24px));display:grid;grid-template-columns:auto 1fr;gap:12px 14px;align-items:center;padding:14px 16px;border-radius:22px;background:#fff;color:#14234a;box-shadow:0 14px 40px rgba(15,37,87,.35),0 0 0 2px rgba(255,138,31,.55);transform:translate(-50%,140%);opacity:0;transition:transform .45s cubic-bezier(.3,1.3,.5,1),opacity .3s}
#instalar-ban.on{transform:translate(-50%,0);opacity:1}
#instalar-ban img{border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#instalar-ban .ib-t{display:flex;flex-direction:column;gap:2px;font-family:'Nunito',system-ui,sans-serif}
#instalar-ban .ib-t b{font:800 17px/1.2 'Baloo 2','Nunito',sans-serif}
#instalar-ban .ib-t span{font-weight:700;font-size:14px;line-height:1.3;color:#4a5a86}
#instalar-ban .ib-b{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end}
#instalar-ban button{border:0;border-radius:999px;padding:11px 20px;font:800 15px/1 'Nunito',system-ui,sans-serif;cursor:pointer}
#instalar-ban .ib-si{color:#fff;background:linear-gradient(135deg,#ff9a3d,#e8590c);box-shadow:0 4px 12px rgba(232,89,12,.4);flex:1;max-width:240px}
#instalar-ban .ib-no{background:#eef2fc;color:#4a5a86}
body:has(#compra) #instalar-ban{bottom:calc(86px + env(safe-area-inset-bottom))}
@media print{#instalar-ban{display:none}}

/* ===== Animaciones de los monstruitos ===== */
.mon{display:block;overflow:visible}
.mon .eye{transform-box:fill-box;transform-origin:center;animation:m-blink 4.6s infinite}
.mon .cuerpo{transform-origin:100px 196px;animation:m-bob 3.2s ease-in-out infinite}
.mon .brazo-d{transform-box:fill-box;transform-origin:20% 50%}
.mon .fx-tw{transform-box:fill-box;transform-origin:center;animation:m-tw 2.4s ease-in-out infinite}
.mon .fx-up{animation:m-up 3.6s ease-in-out infinite}
.mon .fx-pulse{transform-box:fill-box;transform-origin:center;animation:m-pulse 2.8s ease-in-out infinite}
.mon .pet{animation:m-pet 2.2s ease-in-out infinite}
.mon.salta .cuerpo{animation:m-pop .7s cubic-bezier(.3,1.6,.5,1)}
.mon.saluda .brazo-d{animation:m-wave .5s ease-in-out 3}
.mon.triste .cuerpo{animation:m-sad .9s ease-in-out}
.mon.quieto *,.quieto .mon *{animation:none!important}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes m-bob{50%{transform:translateY(-5px) scale(1.01,.99)}}
@keyframes m-pop{0%{transform:none}25%{transform:scale(1.16,.84)}55%{transform:translateY(-30px) scale(.94,1.08)}80%{transform:translateY(0) scale(1.06,.95)}100%{transform:none}}
@keyframes m-sad{30%{transform:scale(1.05,.9) translateY(6px)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes m-wave{50%{transform:rotate(-40deg)}}
@keyframes m-tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes m-up{0%{opacity:0;transform:translateY(16px)}25%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
@keyframes m-pulse{50%{opacity:.6;transform:scale(1.04)}}
@keyframes m-pet{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.mon *{animation:none!important}}

/* ===== App del maestro ===== */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.cab{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:rgba(12,30,74,.82);backdrop-filter:blur(12px);color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.15)}
.marca{display:flex;align-items:center;gap:8px;font:800 21px var(--f-tit);letter-spacing:-.2px;white-space:nowrap}
.marca .logo{width:42px;height:46px;flex:none}
.marca small{display:block;font:700 11px var(--f-txt);opacity:.7;letter-spacing:.2px;margin-top:-4px}
.sel-clase{border:0;background:#fff;color:var(--tinta);border-radius:14px;padding:8px 12px 8px 14px;font:800 17px var(--f-tit);display:flex;align-items:center;gap:8px;min-height:44px;max-width:220px}
.sel-clase span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-clase::after{content:"";border:6px solid transparent;border-top-color:var(--naranja);margin-top:6px}
.pest{display:flex;gap:2px}
.pest button{border:0;background:transparent;color:#c9d9ff;font-weight:800;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:7px;min-height:44px}
.pest button:hover{background:rgba(255,255,255,.08);color:#fff}
.pest button[aria-current=page]{background:rgba(255,255,255,.16);color:#fff}
.pest .ic{font-size:18px}
.cab .der{margin-left:auto;display:flex;gap:6px;align-items:center}
.cab .btn.icono{background:rgba(255,255,255,.12);color:#fff;font-size:19px}
.cab .yo{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:var(--naranja) center/cover;color:#fff;font-weight:900;display:grid;place-items:center;padding:0}
.vista{flex:1;width:100%;max-width:1320px;margin:0 auto;padding:18px 18px 40px}
.navm{display:none}
@media(max-width:900px){
 .pest{display:none}
 .navm{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;box-shadow:0 -6px 20px rgba(15,37,87,.15);padding:6px 6px max(6px,env(safe-area-inset-bottom))}
 .navm button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:800;font-size:11.5px;color:var(--tinta2);padding:6px 0;border-radius:12px}
 .navm .ic{font-size:22px;line-height:1.1}
 .navm button[aria-current=page]{color:var(--naranja2);background:#fff3e6}
 .vista{padding:12px 12px 96px}
 .cab{padding:8px 12px;gap:8px}
 .marca span{display:none}
 .sel-clase{font-size:16px;max-width:52vw}
 .cab .ocultable{display:none}
 #toasts{bottom:calc(86px + env(safe-area-inset-bottom))}
}

/* Paneles */
.panel{background:#fff;border-radius:var(--r3);box-shadow:var(--sombra);padding:20px}
.panel+.panel{margin-top:16px}
.rep-rej>.panel,.ajustes-rej>.panel{margin-top:0}
.panel h2{font-size:24px;margin-bottom:12px}
.panel h3{font-size:19px;margin:18px 0 10px}
.tit-vista{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff;margin:4px 0 14px}
.tit-vista h1{font-size:30px;flex:1}
.tit-vista .seg{background:rgba(255,255,255,.14)}
.tit-vista .seg button{color:#dbe6ff}
.tit-vista .seg button[aria-pressed=true]{color:var(--tinta)}

/* Cabecera de la clase */
.clase-cab{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch;margin-bottom:14px}
.meta-tarj{background:#fff;border-radius:var(--r2);padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sombra2);border:0;text-align:left;width:100%}
.meta-tarj .m-ic{font-size:34px;width:54px;height:54px;border-radius:16px;background:#fff3e0;display:grid;place-items:center;flex:none}
.meta-tarj .m-txt{flex:1;min-width:0}
.meta-tarj b{font:800 18px var(--f-tit);display:block}
.meta-tarj small{color:var(--tinta2);font-weight:700}
.meta-tarj .barra{height:16px;margin-top:6px}
.meta-tarj.lograda{background:linear-gradient(90deg,#fff7d6,#ffe9b0)}
.meta-tarj.lograda .barra>i{background:linear-gradient(90deg,#34c06c,#1f9d55)}
.hoy-tarj{background:#fff;border-radius:var(--r2);padding:10px 18px;display:flex;gap:16px;align-items:center;box-shadow:var(--sombra2)}
.hoy-tarj div{text-align:center}
.hoy-tarj b{font:800 28px var(--f-tit);display:block;line-height:1}
.hoy-tarj small{font-weight:800;color:var(--tinta2);font-size:12px}
.hoy-tarj .p b{color:var(--verde)}.hoy-tarj .n b{color:var(--rojo)}
.barra-acc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.barra-acc .btn{background:rgba(255,255,255,.14);color:#fff}
.barra-acc .btn[aria-pressed=true]{background:#fff;color:var(--tinta)}
.barra-acc .esp{flex:1}
.barra-acc select{border:0;border-radius:12px;padding:0 12px;min-height:44px;font-weight:800;background:rgba(255,255,255,.14);color:#fff}
.barra-acc select option{color:var(--tinta)}
.aviso-modo{background:#fff;color:var(--tinta);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:3px dashed var(--azulv)}
.aviso-modo span{flex:1}
@media(max-width:700px){.clase-cab{grid-template-columns:1fr}.hoy-tarj{justify-content:space-around}}

/* Rejilla de alumnos */
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.tarj{position:relative;border:0;background:#fff;border-radius:22px;padding:8px 8px 10px;box-shadow:0 4px 0 #cfd9f3,0 12px 22px rgba(10,26,70,.18);text-align:center;transition:transform .15s,box-shadow .15s;color:var(--tinta)}
.tarj:hover{transform:translateY(-3px)}
.tarj:active{transform:translateY(1px)}
.tarj .escena{aspect-ratio:1/1;border-radius:16px}
.tarj .escena .mon{position:absolute;left:9%;width:82%;height:auto;bottom:-1%}
.tarj .nom{display:block;font:800 17px var(--f-tit);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarj .pts{position:absolute;top:2px;right:2px;min-width:40px;height:40px;padding:0 8px;border-radius:99px;background:#fff;color:var(--tinta);font:800 20px var(--f-tit);display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.18);border:3px solid var(--naranja);transition:transform .3s}
.tarj .pts.neg{border-color:var(--rojo);color:var(--rojo)}
.tarj .pts.cambia{animation:latido .5s}
@keyframes latido{40%{transform:scale(1.35)}}
.tarj.sel{box-shadow:0 0 0 4px var(--azulv),0 12px 22px rgba(10,26,70,.18)}

  /* ---------- Patrones (recortados al cuerpo, sin tapar la cara) ---------- */
  function patron(tipo, s, g) {
    if (tipo === 'ninguno') return '';
    const r = rng(tipo.length * 977 + 13), out = [], face = (x, y) => ((x - 100) / 52) ** 2 + ((y - (g.fy + 18)) / 44) ** 2 < 1;
    const c = s.claro ? mix(s.col, 0, .28) : mix(s.col, 255, .5), op = s.claro ? .45 : .6;
    if (tipo === 'rayas') {
      for (let y = g.t + 6; y < 200; y += 17) out.push(`<path d="M10 ${y}q45 -9 90 0t90 0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>`);
      return `<g opacity="${op}" mask="url(#mk${s.u})">${out.join('')}</g>`;
    }
    if (tipo === 'escamas') {
      for (let y = g.fy + 30; y < 200; y += 12) for (let x = 20 + ((y / 12) % 2) * 9; x < 190; x += 18) if (!face(x, y)) out.push(`<path d="M${x - 9} ${y}a9 9 0 0 0 18 0" stroke="${c}" stroke-width="2.5" fill="none"/>`);
      return `<g opacity="${op + .1}">${out.join('')}</g>`;
    }
    for (let i = 0; i < 70 && out.length < 14; i++) {
      const x = 22 + r() * 156, y = g.t + 8 + r() * (190 - g.t), sz = 5 + r() * 6;
      if (face(x, y) || out.some(o => Math.hypot(o.x - x, o.y - y) < 22)) continue;
      out.push({ x, y, sz, a: r() * 360 });
    }
    return `<g fill="${c}" opacity="${op}">${out.map(o => {
      if (tipo === 'lunares') return `<circle cx="${f1(o.x)}" cy="${f1(o.y)}" r="${f1(o.sz * .9)}"/>`;
      if (tipo === 'manchas') return `<ellipse cx="${f1(o.x)}" cy="${f1(o.y)}" rx="${f1(o.sz * 1.7)}" ry="${f1(o.sz * 1.1)}" transform="rotate(${f1(o.a)} ${f1(o.x)} ${f1(o.y)})"/>`;
      if (tipo === 'estrellas') return `<polygon points="${star(o.x, o.y, o.sz * 1.15)}" transform="rotate(${f1(o.a / 6)} ${f1(o.x)} ${f1(o.y)})"/>`;
      return `<path transform="translate(${f1(o.x)} ${f1(o.y)}) scale(${f1(o.sz * 2.1)}) rotate(${f1(o.a / 8 - 20)})" d="${HEART}"/>`;
    }).join('')}</g>`;
  }

/* ---------- Confeti ---------- */
function confeti(n = 120, origen) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas'); cv.className = 'confeti'; document.body.append(cv);
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio, x = cv.getContext('2d');
  const cols = ['#ff8a1f', '#ffc21a', '#2f8cff', '#ff5fa2', '#5bc236', '#8e5cf2', '#17bfae'];
  const ox = origen ? origen.x * devicePixelRatio : W / 2, oy = origen ? origen.y * devicePixelRatio : H * .35;
  const P = [...Array(n)].map(() => ({ x: ox, y: oy, vx: (Math.random() - .5) * 26 * devicePixelRatio, vy: (-Math.random() * 22 - 6) * devicePixelRatio, r: Math.random() * 6 + 4, c: cols[Math.floor(Math.random() * cols.length)], a: Math.random() * 6, va: (Math.random() - .5) * .4, f: Math.random() < .3 }));
  let fr = 0; (function paso() {
    x.clearRect(0, 0, W, H); fr++;
    P.forEach(p => { p.vy += .7 * devicePixelRatio; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; if (p.f) { x.beginPath(); x.arc(0, 0, p.r * devicePixelRatio * .6, 0, 7); x.fill(); } else x.fillRect(-p.r * devicePixelRatio / 2, -p.r * devicePixelRatio / 4, p.r * devicePixelRatio, p.r * devicePixelRatio / 2); x.restore(); });
    if (fr < 150) requestAnimationFrame(paso); else cv.remove();
  })();
}

      const a = D.alumnos[uidA], p = D.sistema.precios[clave], r = D.sistema.req[clave] || 0;
      if (p === undefined) throw new Error('Pieza desconocida'); if (a.own.includes(clave)) return;
      if (a.pts < p) throw new Error('Te faltan puntos'); if (a.total < r) throw new Error('Aún no tienes el nivel');
      a.pts -= p; a.own.push(clave); guardar();
    },
    async guardarAspecto(uidA, cfg) { D.alumnos[uidA].cfg = copia(cfg); guardar(); },
    async renombrar(uidA, alias) { D.alumnos[uidA].alias = alias; guardar(); }
  };
}

/* ---------- Firebase ---------- */
function crearFirebase(cfg) {
  let A, F, app, auth, db, app2, auth2, authCb = null;
  const DOM = (typeof DOMINIO_ALUMNOS !== 'undefined' ? DOMINIO_ALUMNOS : 'alumnos.siurot.net');
  const email = u => limpiaUsuario(u) + '@' + DOM;
  const snapLista = s => s.docs.map(d => ({ uid: d.id, id: d.id, ...d.data() }));
  async function auxiliar() { // segunda instancia para crear cuentas sin cerrar la sesión del maestro
    if (!auth2) { app2 = A.initializeApp(cfg, 'altas'); auth2 = A.getAuth(app2); await A.setPersistence(auth2, A.inMemoryPersistence); }
    return auth2;
  }
  async function uidDe(a) { // inicia sesión con las credenciales del alumno en la instancia auxiliar
    const au = await auxiliar(); const r = await A.signInWithEmailAndPassword(au, email(a.usuario), a.clave); return { au, user: r.user };
  }
  const lote = () => F.writeBatch(db);
  const inc = n => F.increment(n);
  const api = {
    modo: 'firebase',
    async iniciar() {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      const [m1, m2, m3] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      A = { ...m1, ...m2 }; F = m3;
      app = A.initializeApp(cfg); auth = A.getAuth(app);
      const cache = typeof CACHE_LOCAL !== 'undefined' && CACHE_LOCAL;
      try { db = cache ? F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }) : F.getFirestore(app); } catch (e) { db = F.getFirestore(app); }
      auth.languageCode = 'es';
    },
    onAuth(cb) { authCb = cb; A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email, nombre: u.displayName || u.email, foto: u.photoURL || '' } : null)); },
    async entrarGoogle() {
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      try { await A.signInWithPopup(auth, p); } catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await A.signInWithRedirect(auth, p); else throw e; }
    },
    async entrarAlumno(usuario, clave, recordar) {
      await A.setPersistence(auth, recordar ? A.browserLocalPersistence : A.browserSessionPersistence);
      await A.signInWithEmailAndPassword(auth, email(usuario), clave.trim());
    },
    async salir() { await A.signOut(auth); },
    async perfilMaestro(uid) { const s = await F.getDoc(F.doc(db, 'maestros', uid)); return s.exists() ? { uid, ...s.data() } : null; },
    async solicitarAcceso(u) {
      const sis = await F.getDoc(F.doc(db, 'sistema', 'config'));
      if (!sis.exists()) { // primer acceso: esta persona se convierte en administradora
        const { precios, req } = Mon.mapas();
        await F.setDoc(F.doc(db, 'sistema', 'config'), { admin: u.uid, precios, req, centro: 'CEIP Manuel Siurot', creado: ahora() });
        await F.setDoc(F.doc(db, 'maestros', u.uid), { nombre: u.nombre, email: u.email, estado: 'activo', rol: 'admin', clases: [], creado: ahora() });
      } else {
        const ref = F.doc(db, 'maestros', u.uid), s = await F.getDoc(ref);
        if (!s.exists()) await F.setDoc(ref, { nombre: u.nombre, email: u.email, estado: 'pendiente', rol: 'maestro', clases: [], creado: ahora() });
      }
      return this.perfilMaestro(u.uid);
    },
    verSistema(cb, err) { return F.onSnapshot(F.doc(db, 'sistema', 'config'), s => cb(s.exists() ? s.data() : null), err); },
    verMaestro(uid, cb, err) { return F.onSnapshot(F.doc(db, 'maestros', uid), s => cb(s.exists() ? { uid, ...s.data() } : null), err); },
    verMaestros(cb, err) { return F.onSnapshot(F.collection(db, 'maestros'), s => cb(snapLista(s)), err); },
    verClases(cb, err) { return F.onSnapshot(F.collection(db, 'clases'), s => cb(snapLista(s).sort((a, b) => a.nombre.localeCompare(b.nombre))), err); },
    verClase(id, cb, err) { return F.onSnapshot(F.doc(db, 'clases', id), s => cb(s.exists() ? { id, ...s.data() } : null), err); },
    verAlumnos(claseId, cb, err) { const q = claseId === '*' ? F.collection(db, 'alumnos') : F.query(F.collection(db, 'alumnos'), F.where('clase', '==', claseId)); return F.onSnapshot(q, s => cb(snapLista(s)), err); },
    verAlumno(uid, cb, err) { return F.onSnapshot(F.doc(db, 'alumnos', uid), s => cb(s.exists() ? { uid, ...s.data() } : null), err); },
    verMovs(claseId, desde, cb, err) { const q = F.query(F.collection(db, 'clases', claseId, 'movs'), F.where('t', '>=', desde), F.orderBy('t', 'desc'), F.limit(4000)); return F.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err); },
    async darPuntos({ clase, alumnos, hab, maestro, nota }) {
      const b = lote(), out = []; let pos = 0;
      alumnos.forEach(a => {
        const ref = F.doc(F.collection(db, 'clases', clase.id, 'movs'));
        const m = { id: ref.id, t: ahora(), alumno: a.uid, h: hab.id, n: hab.n, ic: hab.ic, v: hab.v, tipo: 'punto', maestro: maestro.uid, mn: maestro.nombre }; if (nota) m.nota = nota;
        const { id, ...guardado } = m; b.set(ref, guardado);
        const up = { ult: [entradaUlt(m), ...(a.ult || [])].slice(0, ULT_MAX) };
        if (hab.v > 0 || clase.restar) up.pts = inc(hab.v);
        if (hab.v > 0) { up.total = inc(hab.v); pos += hab.v; } else up.neg = inc(-hab.v);
        up['cnt.' + hab.id] = inc(1);
        b.update(F.doc(db, 'alumnos', a.uid), up); out.push(m);
      });
      if (pos && clase.meta) b.update(F.doc(db, 'clases', clase.id), { 'meta.prog': inc(pos) });
      await b.commit(); return out;
    },
    async canjear({ clase, alumno, rec, maestro }) {
      const ref = F.doc(F.collection(db, 'clases', clase.id, 'movs')), aRef = F.doc(db, 'alumnos', alumno.uid);
      const m = { id: ref.id, t: ahora(), alumno: alumno.uid, h: rec.id, n: rec.n, ic: rec.ic, v: -rec.p, coste: rec.p, tipo: 'canje', maestro: maestro.uid, mn: maestro.nombre };
      await F.runTransaction(db, async tx => {
        const s = await tx.get(aRef); const d = s.data(); if ((d.pts || 0) < rec.p) throw new Error('Puntos insuficientes');
        const { id, ...g } = m; tx.set(ref, g); tx.update(aRef, { pts: inc(-rec.p), ult: [entradaUlt(m), ...(d.ult || [])].slice(0, ULT_MAX) });
      });
      return [m];
    },
    async deshacer(claseId, lista, clase, alumnosActuales) {
      const b = lote(); let pos = 0; const por = {};
      lista.forEach(m => { (por[m.alumno] = por[m.alumno] || []).push(m); b.delete(F.doc(db, 'clases', claseId, 'movs', m.id)); });
      Object.entries(por).forEach(([uid, ms]) => {
        const a = alumnosActuales.find(x => x.uid === uid); if (!a) return;
        let p = 0, t = 0, n = 0; ms.forEach(m => { if (m.tipo === 'canje') p += m.coste; else { if (m.v > 0 || clase.restar) p -= m.v; if (m.v > 0) { t -= m.v; pos += m.v; } else n -= -m.v; } });
        const ids = ms.map(m => m.id), up = { pts: inc(p), total: inc(t), neg: inc(n), ult: (a.ult || []).filter(x => !ids.includes(x.id)) };
        ms.forEach(m => { if (m.tipo !== 'canje') up['cnt.' + m.h] = inc(-1); }); b.update(F.doc(db, 'alumnos', uid), up);
      });
      if (pos && clase.meta) b.update(F.doc(db, 'clases', claseId), { 'meta.prog': inc(-pos) });
      await b.commit();
    },
    async guardarClase(id, datos) { await F.updateDoc(F.doc(db, 'clases', id), datos); },
    async crearClase(nombre) { const ref = F.doc(F.collection(db, 'clases')); await F.setDoc(ref, { nombre, habilidades: HAB_DEF, recompensas: REC_DEF, meta: { n: 'Fiesta de clase', obj: 200, prog: 0, ic: '🎉' }, restar: true, ausentes: { f: '', ids: [] }, grupos: [], creado: ahora() }); return ref.id; },
    async borrarClase(id) {
      const s = await F.getDocs(F.query(F.collection(db, 'alumnos'), F.where('clase', '==', id)));
      let b = lote(), n = 0; const enviar = async () => { await b.commit(); b = lote(); n = 0; };
      for (const d of s.docs) { b.update(d.ref, { clase: '' }); if (++n >= 400) await enviar(); }
      for (const d of (await F.getDocs(F.collection(db, 'clases', id, 'movs'))).docs) { b.delete(d.ref); if (++n >= 400) await enviar(); }
      b.delete(F.doc(db, 'clases', id)); await enviar();
    },
    async guardarMaestro(uid, datos) { await F.updateDoc(F.doc(db, 'maestros', uid), datos); },
    async borrarMaestro(uid) { await F.deleteDoc(F.doc(db, 'maestros', uid)); },
    async importarAlumnos(claseId, lista, prog) {
      const res = { creados: 0, actualizados: 0, errores: [] }; const au = await auxiliar();
      for (const [i, a] of lista.entries()) {
        prog && prog(i + 1, lista.length);
        try {
          let uid;
          try { uid = (await A.createUserWithEmailAndPassword(au, email(a.usuario), a.clave)).user.uid; }
          catch (e) {
            if (e.code !== 'auth/email-already-in-use') throw e;
            try { uid = (await A.signInWithEmailAndPassword(au, email(a.usuario), a.clave)).user.uid; }
            catch (e2) { throw new Error('ya existe una cuenta con ese usuario y otra clave'); }
          }
          await A.signOut(au);
          const ref = F.doc(db, 'alumnos', uid), s = await F.getDoc(ref);
          if (s.exists()) { await F.updateDoc(ref, { nombre: a.nombre, clase: claseId, clave: a.clave, usuario: a.usuario }); res.actualizados++; }
          else { await F.setDoc(ref, nuevoAlumnoDoc(a, claseId)); res.creados++; }
        } catch (e) {
          const msg = e.code === 'auth/too-many-requests' ? 'demasiados intentos seguidos; espera unos minutos y vuelve a importar' : e.code === 'auth/weak-password' ? 'la clave debe tener al menos 6 caracteres' : (e.message || e.code);
          res.errores.push(a.usuario + ': ' + msg);
          if (e.code === 'auth/too-many-requests') break;
        }
      }
      return res;
    },
    async actualizarAlumno(uid, datos) { await F.updateDoc(F.doc(db, 'alumnos', uid), datos); },
    async cambiarClave(a, nueva) {
      const { au, user } = await uidDe(a); await A.updatePassword(user, nueva); await A.signOut(au);
      await F.updateDoc(F.doc(db, 'alumnos', a.uid), { clave: nueva });
    },
    async borrarAlumno(a) {
      let aviso = '';
      try { const { user } = await uidDe(a); await A.deleteUser(user); } catch (e) { aviso = 'No se pudo borrar la cuenta de acceso (bórrala en la consola de Firebase si hace falta).'; }
      await F.deleteDoc(F.doc(db, 'alumnos', a.uid)); return aviso;
    },
    async guardarCatalogo(mapas) { await F.updateDoc(F.doc(db, 'sistema', 'config'), mapas); },
    async reiniciar(claseId, todo) {
      const s = await F.getDocs(F.query(F.collection(db, 'alumnos'), F.where('clase', '==', claseId)));
      let b = lote(), n = 0; const enviar = async () => { await b.commit(); b = lote(); n = 0; };
      for (const d of s.docs) { const up = { pts: 0, neg: 0, ult: [], cnt: {} }; if (todo) Object.assign(up, { total: 0, own: [], cfg: Mon.aleatorio() }); b.update(d.ref, up); if (++n >= 400) await enviar(); }
      const ms = await F.getDocs(F.collection(db, 'clases', claseId, 'movs'));
      for (const d of ms.docs) { b.delete(d.ref); if (++n >= 400) await enviar(); }
      const cd = await F.getDoc(F.doc(db, 'clases', claseId)); if (cd.exists() && cd.data().meta) b.update(F.doc(db, 'clases', claseId), { 'meta.prog': 0 }); await enviar();
    },
    async exportar() {
      const out = { exportado: new Date().toISOString(), maestros: {}, clases: {}, alumnos: {} };
      (await F.getDocs(F.collection(db, 'maestros'))).docs.forEach(d => out.maestros[d.id] = d.data());
      (await F.getDocs(F.collection(db, 'alumnos'))).docs.forEach(d => out.alumnos[d.id] = d.data());
      for (const d of (await F.getDocs(F.collection(db, 'clases'))).docs) { out.clases[d.id] = d.data(); out.clases[d.id].movs = (await F.getDocs(F.collection(db, 'clases', d.id, 'movs'))).docs.map(x => ({ id: x.id, ...x.data() })); }
      return out;
    },
    async comprar(uidA, clave) {
      const ref = F.doc(db, 'alumnos', uidA), sis = await F.getDoc(F.doc(db, 'sistema', 'config'));
      const p = sis.data().precios[clave], r = (sis.data().req || {})[clave] || 0;
      await F.runTransaction(db, async tx => {
        const s = await tx.get(ref), a = s.data();
        if (p === undefined) throw new Error('Pieza desconocida'); if ((a.own || []).includes(clave)) return;
        if (a.pts < p) throw new Error('Te faltan puntos'); if ((a.total || 0) < r) throw new Error('Aún no tienes el nivel');
        tx.update(ref, { pts: a.pts - p, own: [...(a.own || []), clave] });
      });
    },
    async guardarAspecto(uidA, cfg) { await F.updateDoc(F.doc(db, 'alumnos', uidA), { cfg }); },
    async renombrar(uidA, alias) { await F.updateDoc(F.doc(db, 'alumnos', uidA), { alias }); }
  };
  return api;
}

const mmss = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

function motorTiempo(alTic, alFin) {
  let total = 0, resta = 0, marcha = false, ult = 0, raf, ultSeg = -1;
  const paso = t => { if (!marcha) return; resta -= (t - ult) / 1000; ult = t; const s = Math.ceil(resta); if (s !== ultSeg) { ultSeg = s; if (s <= 5 && s > 0) Sonido.tocar('tic'); } if (resta <= 0) { resta = 0; marcha = false; alTic(resta, total); alFin && alFin(); return; } alTic(resta, total); raf = requestAnimationFrame(paso); };

function parsearLista(txt) {
  const L = txt.replace(/\ufeff/g, '').split(/\r?\n/).map(l => l.replace(/ /g, ' ').trim()).filter(Boolean), csv = [], nombresL = [], creds = [];
  const reCred = /(?:Usuario\s+)?([A-Za-z0-9._-]+)\s+Clave\s+(\S+)/gi, reCurso = /·\s*\d+\s*[º°ª]?\s*[A-Za-z]\b/;
  const nombres = s => s.split(/\s*·\s*\d+\s*[º°ª]?\s*[A-Za-z]\b\s*/).map(x => x.trim()).filter(Boolean);
  L.forEach((l, i) => {
    const cs = [...l.matchAll(reCred)];
    if (cs.length) { const antes = l.slice(0, cs[0].index).trim(); if (antes && !/^usuario$/i.test(antes)) nombresL.push(...nombres(antes)); cs.forEach(m => creds.push({ usuario: limpiaUsuario(m[1]), clave: m[2] })); return; }
    if (/^usuario$/i.test(l)) return;
    const p = l.split(/\s*[;\t]\s*|\s*,\s*/);
    if (p.length >= 3 && !/^nombre$/i.test(p[0])) { csv.push({ nombre: p[0], usuario: limpiaUsuario(p[1]), clave: p[2] }); return; }
    if (reCurso.test(l) || /^usuario/i.test(L[i + 1] || '')) nombresL.push(...nombres(l));
  });
  // Empareja cada usuario con el nombre que más se le parece (el PDF puede venir desordenado al copiarlo)
  const pal = n => n.split(/\s+/).map(limpiaUsuario).filter(Boolean);
  const puntua = (n, u) => { const w = pal(n); if (!w.length) return 0; const base = u.replace(/\d+$/, ''); if (w.slice(1).some(x => base === w[0] + x[0])) return 3; if (base.startsWith(w[0]) || (base.length >= 3 && w[0].startsWith(base.slice(0, -1)))) return 2; return 0; };
  const libres = [...nombresL], out = [...csv];
  creds.forEach(c => {
    let mejor = -1, pt = -1; libres.forEach((n, i) => { const q = puntua(n, c.usuario); if (q > pt) { pt = q; mejor = i; } });
    const nombre = mejor >= 0 ? libres.splice(mejor, 1)[0] : '';
    out.push({ nombre, ...c, aviso: nombre && pt === 0 ? 'Revisa: el usuario no se parece al nombre' : '' });
  });
  const vistos = new Set();
  return out.map(a => { let err = ''; if (!a.nombre) err = 'Falta el nombre'; else if (!a.usuario) err = 'Falta el usuario'; else if ((a.clave || '').length < 6) err = 'La clave necesita 6 caracteres o más'; else if (vistos.has(a.usuario)) err = 'Usuario repetido'; vistos.add(a.usuario); return { aviso: '', ...a, err }; });
}

  const op = await modal({
    titulo: esc(a.nombre), clase: 'pequeña',
    cuerpo: `<div style="display:flex;flex-direction:column;gap:8px">${[['nombre', '✏️ Cambiar nombre'], ['clase', '🔁 Cambiar de clase'], ['clave', '🔑 Cambiar clave'], ['aspecto', '🎨 Restablecer monstruo (conserva sus piezas)'], ['borrar', '🗑️ Borrar alumno']].map(([k, t]) => `<button class="btn ${k === 'borrar' ? 'peligro' : 'sec'}" data-o="${k}" style="justify-content:flex-start">${t}</button>`).join('')}</div>`,
    alAbrir: (c, cerrar) => c.querySelectorAll('[data-o]').forEach(b => b.onclick = () => cerrar(b.dataset.o))
  });
  try {
    if (op === 'nombre') { const n = await pedir('Cambiar nombre', { valor: a.nombre, etiqueta: 'Nombre y apellidos' }); if (n) await Datos.actualizarAlumno(a.uid, { nombre: n }); }
    if (op === 'clase') {
      const id = await modal({ titulo: 'Mover a…', clase: 'pequeña', cuerpo: `<div class="clases-lista" style="flex-direction:column">${E.todasClases.filter(c => c.id !== a.clase).map(c => `<button data-id="${c.id}" style="text-align:left">${esc(c.nombre)}</button>`).join('')}</div>`, alAbrir: (c, cerrar) => c.querySelectorAll('[data-id]').forEach(b => b.onclick = () => cerrar(b.dataset.id)) });
      if (id) { await Datos.actualizarAlumno(a.uid, { clase: id }); toast('Alumno cambiado de clase', { tipo: 'ok' }); }
    }
    if (op === 'clave') cambiarClave(a);
    if (op === 'aspecto' && await confirmar('Su monstruo volverá al aspecto inicial. Las piezas compradas siguen siendo suyas.', { si: 'Restablecer' })) await Datos.actualizarAlumno(a.uid, { cfg: { ...Mon.BASE, color: a.cfg.color } });
    if (op === 'borrar' && await confirmar(`Se borrará a <b>${esc(a.nombre)}</b>, su monstruo y sus puntos. No se puede deshacer.`, { si: 'Borrar', peligro: true })) { const aviso = await Datos.borrarAlumno(a); toast('Alumno borrado'); if (aviso) avisar(aviso); }
  } catch (e) { errorEscucha(e); }
}
async function cambiarClave(a) {
  const n = await pedir('Cambiar clave', { valor: claveAzar(), etiqueta: 'Nueva clave (6 caracteres o más)', texto: `Para <b>${esc(a.nombre)}</b> (${esc(a.usuario)}).`, validar: v => v.length < 6 ? 'La clave necesita 6 caracteres o más' : '' });
  if (!n) return;
  try { await Datos.cambiarClave(a, n); toast('Clave cambiada', { tipo: 'ok', ic: '🔑' }); } catch (e) { avisar('No se pudo cambiar la clave: ' + esc(textoError(e)) + '<br><br>Si la clave guardada no coincide con la real, cámbiala desde la consola de Firebase.'); }
}
function urlAlumnado() { if (URL_ALUMNADO) return URL_ALUMNADO; const u = new URL(location.href); u.hash = ''; u.search = ''; u.pathname = u.pathname.replace(/[^/]*$/, ''); return u.href; }
function imprimirTarjetas(cl, lista) {
  if (!lista.length) return toast('No hay alumnado que imprimir.');
  const url = urlAlumnado();
  const css = `*{box-sizing:border-box}body{font-family:Nunito,Arial,sans-serif;margin:0;color:#14234a}.h{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6mm;padding:8mm}.t{border:2px dashed #b9c6ea;border-radius:5mm;padding:4mm;display:flex;gap:3mm;align-items:center;break-inside:avoid;height:46mm}.e{width:26mm;height:32mm;border-radius:3mm;overflow:hidden;position:relative;flex:none}.e .fondo{position:absolute;inset:0;width:100%;height:100%}.e .mon{position:absolute;left:4%;width:92%;bottom:0}.d b{display:block;font-size:12pt;line-height:1.1;margin-bottom:2mm}.d small{display:block;font-size:8pt;color:#4a5a85}.d code{font:800 13pt ui-monospace,Consolas,monospace;display:block;margin-bottom:1mm}.u{font-size:7pt;color:#4a5a85;word-break:break-all;margin-top:1mm}h1{font-size:14pt;margin:8mm 8mm 0}@page{size:A4;margin:0}`;
  const tarj = lista.slice().sort((a, b) => a.nombre.localeCompare(b.nombre)).map(a => `<div class="t"><div class="e">${Mon.fondo(a.cfg.fondo)}${Mon.svg(a.cfg, { anim: false })}</div><div class="d"><b>${esc(a.nombre)}</b><small>Usuario</small><code>${esc(a.usuario)}</code><small>Clave</small><code>${esc(a.clave || '')}</code><div class="u">${esc(url)}</div></div></div>`).join('');
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.append(f);
  f.contentDocument.open(); f.contentDocument.write(`<!doctype html><html><head><meta charset="utf-8"><title>Tarjetas ${esc(cl.nombre)}</title><style>${css}</style></head><body><h1>Aula Siurot · ${esc(cl.nombre)}</h1><div class="h">${tarj}</div></body></html>`); f.contentDocument.close();
  setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 2000); }, 300);
}
/* --- Catálogo de piezas y precios --- */
function admCatalogo(z) {
  if (!E.sistema) return html(z, '<div class="cargando"><div><i></i></div></div>');
  const P = { ...(E.sistema.precios || {}) }, R = { ...(E.sistema.req || {}) }; let cat = E.admCat || 'color';
  const lvDe = k => { if (!R[k]) return 0; let l = 0; Mon.NIVELES.forEach((n, i) => { if (n[0] <= R[k]) l = i + 1; }); return l; };
  const base = { color: 'violeta', ojos: 'dos', boca: 'sonrisa' };
  const pinta = () => {
    html(z, `<div class="panel"><h2>Taller de monstruos</h2><p style="margin:-6px 0 12px;color:var(--tinta2);font-weight:700">Precio en puntos de cada pieza y nivel mínimo para comprarla. Los cambios se aplican a todo el centro.</p>
    <div class="seg" id="cat-t" style="margin-bottom:12px">${Mon.ORDEN.map(k => `<button data-k="${k}" aria-pressed="${k === cat}">${Mon.CAT[k].ic} ${Mon.CAT[k].n}</button>`).join('')}</div>
    <div class="tabla-w"><table class="tabla cat-tabla"><thead><tr><th></th><th>Pieza</th><th>Precio ⭐</th><th>Nivel mínimo</th></tr></thead><tbody>${Mon.CAT[cat].i.map(it => { const k = cat + ':' + it[0]; return `<tr><td><span class="escena vista-previa">${Mon.fondo(cat === 'fondo' ? it[0] : 'cielo')}${Mon.svg({ ...base, [cat]: it[0] }, { anim: false })}</span></td><td><b>${esc(it[1])}</b></td><td><input type="number" min="0" max="9999" data-p="${k}" value="${P[k] ?? it[2]}"></td><td><select data-r="${k}"><option value="0">—</option>${Mon.NIVELES.map((n, i) => i ? `<option value="${i + 1}" ${lvDe(k) === i + 1 ? 'selected' : ''}>${i + 1} · ${n[1]}</option>` : '').join('')}</select></td></tr>`; }).join('')}</tbody></table></div>
    <div class="fila" style="justify-content:flex-end;margin-top:14px"><button class="btn sec" id="cat-def">Valores por defecto</button><button class="btn pri" id="cat-ok">💾 Guardar precios</button></div></div>`);
    $$('#cat-t button').forEach(b => b.onclick = () => { leer(); cat = E.admCat = b.dataset.k; pinta(); });
    $('#cat-def').onclick = async () => { if (await confirmar('Se restaurarán los precios y niveles originales de todas las piezas.', { si: 'Restaurar' })) { await Datos.guardarCatalogo(Mon.mapas()).catch(errorEscucha); toast('Precios restaurados', { tipo: 'ok' }); } };
    $('#cat-ok').onclick = async () => { leer(); try { await Datos.guardarCatalogo({ precios: P, req: R }); toast('Precios guardados', { tipo: 'ok', ic: '✅' }); } catch (e) { errorEscucha(e); } };
  };
  const leer = () => { $$('[data-p]', z).forEach(i => P[i.dataset.p] = Math.max(0, Math.round(+i.value || 0))); $$('[data-r]', z).forEach(s => { const l = +s.value; if (l > 1) R[s.dataset.r] = Mon.NIVELES[l - 1][0]; else delete R[s.dataset.r]; }); };
  pinta();
}
/* --- Curso y copias --- */
function admCurso(z) {
  html(z, `<div class="panel"><h2>Final o inicio de curso</h2><p style="color:var(--tinta2);font-weight:700;margin-top:-6px">Para cambiar a los alumnos de clase al empezar el curso, usa “Clases y alumnado” (⋯ → Cambiar de clase) o renombra la clase (4ºA → 5ºA).</p>
  ${E.todasClases.map(c => `<div class="maestro-f"><div class="av" style="background:var(--naranja)">🏫</div><div class="mt"><b>${esc(c.nombre)}</b><small>Meta: ${c.meta ? `${c.meta.prog}/${c.meta.obj}` : '—'}</small></div><button class="btn sec chico" data-pts="${c.id}">Poner puntos a 0</button><button class="btn peligro chico" data-todo="${c.id}">Empezar de cero</button></div>`).join('') || '<div class="vacio">No hay clases.</div>'}
  <p style="font-size:14px;font-weight:700;color:var(--tinta2)"><b>Poner puntos a 0</b>: borra saldo e historial, pero cada alumno conserva su nivel y su monstruo. <b>Empezar de cero</b>: además borra nivel, piezas y aspecto.</p></div>
  <div class="panel"><h2>Copia de seguridad</h2><p style="color:var(--tinta2);font-weight:700;margin-top:-6px">Descarga todos los datos (profesorado, clases, alumnado e historial) en un archivo JSON. Guárdala en tu Drive del centro.</p><button class="btn azul" id="backup">⬇ Descargar copia</button></div>`);
  z.onclick = async e => {
    const b = e.target.closest('[data-pts],[data-todo]'); if (!b) return; const id = b.dataset.pts || b.dataset.todo, todo = !!b.dataset.todo, c = E.todasClases.find(x => x.id === id);
    const ok = todo ? await pedir('Empezar de cero', { texto: `Se borrarán puntos, historial, niveles, piezas y aspecto de todo el alumnado de <b>${esc(c.nombre)}</b>. Escribe <b>BORRAR</b> para confirmar.`, ok: 'Borrar todo', validar: v => v.toUpperCase() !== 'BORRAR' ? 'Escribe BORRAR' : '' }) : await confirmar(`Los puntos para gastar y el historial de <b>${esc(c.nombre)}</b> volverán a 0.`, { si: 'Poner a 0', peligro: true });
    if (!ok) return;
    try { await Datos.reiniciar(id, todo); toast('Hecho', { tipo: 'ok', ic: '✅' }); } catch (err) { errorEscucha(err); }
  };
  $('#backup').onclick = async () => { try { toast('Preparando copia…', { ic: '⏳' }); const d = await Datos.exportar(); descargar(`aula-siurot-copia-${hoyISO()}.json`, JSON.stringify(d, null, 1), 'application/json'); } catch (e) { errorEscucha(e); } };
}

</script>
