<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi monstruo · Aula Siurot</title>
<meta name="theme-color" content="#0f2557">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='55' r='42' fill='%23ff8a1f'/%3E%3Ccircle cx='36' cy='48' r='10' fill='%23fff'/%3E%3Ccircle cx='64' cy='48' r='10' fill='%23fff'/%3E%3Ccircle cx='36' cy='49' r='5' fill='%2314234a'/%3E%3Ccircle cx='64' cy='49' r='5' fill='%2314234a'/%3E%3Cpath d='M36 70q14 12 28 0' stroke='%2314234a' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ===== Base común ===== */
:root{
 --noche:#0f2557;--azul:#1e4fa3;--azulv:#2f6fe0;--tinta:#14234a;--tinta2:#4a5a85;--nube:#f3f6ff;--nube2:#e8eefc;--linea:#dbe3f7;
 --naranja:#ff8a1f;--naranja2:#f06a00;--verde:#1f9d55;--verde2:#e3f7ea;--rojo:#e5484d;--rojo2:#fdeaea;--oro:#ffc21a;--blanco:#fff;
 --r1:12px;--r2:18px;--r3:26px;--sombra:0 10px 30px rgba(15,37,87,.18);--sombra2:0 2px 0 rgba(20,35,74,.08);
 --f-tit:"Baloo 2","Nunito",system-ui,sans-serif;--f-txt:"Nunito",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{background:#163a80}
body{font-family:var(--f-txt);color:var(--tinta);background:linear-gradient(160deg,var(--noche),var(--azul)) fixed;min-height:100vh;min-height:100dvh;font-size:16px;line-height:1.4}
h1,h2,h3{font-family:var(--f-tit);line-height:1.15;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azulv);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:11px 18px;font-weight:800;font-size:15px;line-height:1.1;background:var(--nube2);color:var(--tinta);transition:transform .12s,filter .12s,background .15s;min-height:44px;text-decoration:none;white-space:nowrap}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.pri{background:linear-gradient(180deg,#ff9d3d,var(--naranja2));color:#fff;box-shadow:0 3px 0 #c45400,0 6px 14px rgba(240,106,0,.3)}
.btn.sec{background:var(--nube2);color:var(--tinta)}
.btn.azul{background:linear-gradient(180deg,#4b8bff,#1f5fd6);color:#fff;box-shadow:0 3px 0 #1846a3}
.btn.verde{background:linear-gradient(180deg,#34c06c,#178a46);color:#fff;box-shadow:0 3px 0 #0f6a34}
.btn.peligro{background:var(--rojo);color:#fff;box-shadow:0 3px 0 #a92e32}
.btn.fant{background:transparent;color:inherit}
.btn.fant:hover{background:rgba(127,150,210,.15)}
.btn.chico{min-height:34px;padding:7px 12px;font-size:14px;border-radius:11px}
.btn.icono{width:44px;padding:0}
.btn.icono.chico{width:34px}

/* Campos */
.campo{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.campo>span{font-weight:800;font-size:14px;color:var(--tinta2)}
.campo input,.campo select,.campo textarea,.inp{border:2px solid var(--linea);border-radius:12px;padding:10px 12px;background:#fff;min-height:44px;width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus,.inp:focus{border-color:var(--azulv);outline:0}
.fila{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fila>.campo{flex:1;min-width:120px}
.interruptor{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.interruptor input{appearance:none;width:46px;height:28px;border-radius:99px;background:#cdd6ee;position:relative;transition:background .2s;flex:none;margin:0;cursor:pointer}
.interruptor input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .2s}
.interruptor input:checked{background:var(--verde)}
.interruptor input:checked::after{transform:translateX(18px)}

/* Escena (fondo + monstruo) */
.escena{position:relative;overflow:hidden;isolation:isolate}
.escena>.fondo{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.escena>.mon{position:relative;width:100%;height:100%}

/* Modales */
.velo{position:fixed;inset:0;background:rgba(9,20,52,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;opacity:0;transition:opacity .2s}
.velo.on{opacity:1}
.modal{background:#fff;border-radius:var(--r3);box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(560px,100%);max-height:min(88vh,860px);display:flex;flex-direction:column;transform:translateY(18px) scale(.98);transition:transform .22s cubic-bezier(.3,1.3,.5,1);overflow:hidden}
.velo.on .modal{transform:none}
.modal.pequeña{width:min(420px,100%)}
.modal.grande{width:min(860px,100%)}
.m-cab{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.m-cab h2{font-size:22px;flex:1}
.m-x{border:0;background:var(--nube2);width:38px;height:38px;border-radius:50%;font-size:16px;font-weight:800;flex:none}
.m-cuerpo{padding:8px 18px 14px;overflow:auto;flex:1;overscroll-behavior:contain}
.m-pie{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px 18px;border-top:1px solid var(--nube2);flex-wrap:wrap}
.m-texto{margin:4px 0 6px;font-size:17px}
@media(max-width:620px){
 .velo{align-items:flex-end;padding:0}
 .modal{border-radius:24px 24px 0 0;max-height:92vh;max-height:92dvh;width:100%!important;transform:translateY(40px)}
 .m-pie{padding-bottom:max(18px,env(safe-area-inset-bottom))}
 .m-pie .btn{flex:1}
}

/* Avisos */
#toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:200;width:min(94vw,520px);pointer-events:none}
.toast{pointer-events:auto;background:var(--tinta);color:#fff;border-radius:16px;padding:10px 12px 10px 16px;font-weight:700;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;transition:.25s;max-width:100%}
.toast.on{transform:none;opacity:1}
.toast span{flex:1;display:flex;gap:8px;align-items:center}
.toast .t-ic{font-size:20px}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;border-radius:10px;padding:7px 12px}
.toast.ok{background:#14603a}.toast.error{background:#a32a2e}

/* Burbuja de puntos */
.burbuja-pts{position:fixed;transform:translate(-50%,-50%);font:800 34px var(--f-tit);color:#fff;pointer-events:none;z-index:150;animation:subir 1.3s ease-out forwards;padding:2px 14px;border-radius:99px;background:var(--verde);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.burbuja-pts.neg{background:var(--rojo)}
.burbuja-pts.oro{background:linear-gradient(180deg,#ffd34d,#f2a200);color:#5a3a00}
@keyframes subir{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.confeti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:300}

/* Varios */
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-weight:800;font-size:13px;background:var(--nube2);white-space:nowrap}
.chip.ok{background:var(--verde2);color:#14603a}.chip.mal{background:var(--rojo2);color:#a32a2e}.chip.oro{background:#fff1c7;color:#7a5200}
.seg{display:inline-flex;background:var(--nube2);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:10px;padding:7px 14px;font-weight:800;color:var(--tinta2);min-height:36px}
.seg button[aria-pressed=true]{background:#fff;color:var(--tinta);box-shadow:var(--sombra2)}
.vacio{text-align:center;color:var(--tinta2);padding:28px 12px}
.vacio b{display:block;font-family:var(--f-tit);font-size:20px;color:var(--tinta);margin-bottom:4px}
.barra{height:14px;border-radius:99px;background:var(--nube2);overflow:hidden;position:relative}
.barra>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ffb347,var(--naranja));transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.cargando{display:grid;place-items:center;min-height:60vh;color:#fff;font:800 20px var(--f-tit)}
.cargando i{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.25);border-top-color:var(--naranja);animation:gira 1s linear infinite;margin:0 auto 12px;display:block}
@keyframes gira{to{transform:rotate(360deg)}}
.demo-aviso{background:#fff1c7;color:#6b4800;font-weight:700;font-size:13px;text-align:center;padding:6px 12px}
.demo-aviso button{border:0;background:transparent;text-decoration:underline;font-weight:800;color:inherit;padding:0 4px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== Animaciones de los monstruitos ===== */
.mon{display:block;overflow:visible}
.mon .eye{transform-box:fill-box;transform-origin:center;animation:m-blink 4.6s infinite}
.mon .cuerpo{transform-origin:100px 196px;animation:m-bob 3.2s ease-in-out infinite}
.mon .brazo-d{transform-box:fill-box;transform-origin:20% 50%}
.mon .fx-tw{transform-box:fill-box;transform-origin:center;animation:m-tw 2.4s ease-in-out infinite}
.mon .fx-up{animation:m-up 3.6s ease-in-out infinite}
.mon .fx-pulse{transform-box:fill-box;transform-origin:center;animation:m-pulse 2.8s ease-in-out infinite}
.mon .pet{animation:m-pet 2.2s ease-in-out infinite}
.mon.salta .cuerpo{animation:m-pop .7s cubic-bezier(.3,1.6,.5,1)}
.mon.saluda .brazo-d{animation:m-wave .5s ease-in-out 3}
.mon.triste .cuerpo{animation:m-sad .9s ease-in-out}
.mon.quieto *,.quieto .mon *{animation:none!important}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes m-bob{50%{transform:translateY(-5px) scale(1.01,.99)}}
@keyframes m-pop{0%{transform:none}25%{transform:scale(1.16,.84)}55%{transform:translateY(-30px) scale(.94,1.08)}80%{transform:translateY(0) scale(1.06,.95)}100%{transform:none}}
@keyframes m-sad{30%{transform:scale(1.05,.9) translateY(6px)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes m-wave{50%{transform:rotate(-40deg)}}
@keyframes m-tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}}
@keyframes m-up{0%{opacity:0;transform:translateY(16px)}25%{opacity:1}100%{opacity:0;transform:translateY(-40px)}}
@keyframes m-pulse{50%{opacity:.6;transform:scale(1.04)}}
@keyframes m-pet{50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.mon *{animation:none!important}}

/* ===== App del alumnado ===== */
.al{display:grid;grid-template-columns:minmax(320px,410px) 1fr;gap:22px;max-width:1200px;margin:0 auto;padding:18px;align-items:start}
.izq{position:sticky;top:18px}
.tarjeta-mon{background:#fff;border-radius:32px;padding:12px;box-shadow:var(--sombra)}
.top-al{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.top-al .hola{flex:1;font:800 15px var(--f-txt);color:var(--tinta2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-al .hola b{color:var(--tinta)}
.escenario{position:relative;aspect-ratio:4/5;border-radius:24px;overflow:hidden;isolation:isolate;cursor:pointer;user-select:none}
.escenario>.fondo{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.escenario>.mon{position:absolute;left:4%;width:92%;bottom:0;height:auto;max-height:100%}
.pill-pts{position:absolute;top:12px;right:12px;background:#fff;border-radius:99px;padding:5px 14px 5px 10px;font:800 24px var(--f-tit);box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;gap:4px;z-index:2}
.pill-pts small{font:800 11px var(--f-txt);color:var(--tinta2);display:block;line-height:1;margin-top:-2px}
.pill-pts.sube{animation:latido .6s}
@keyframes latido{40%{transform:scale(1.25)}}
.chip-niv{position:absolute;top:12px;left:12px;z-index:2;background:rgba(20,35,74,.78);color:#fff;border-radius:99px;padding:5px 12px;font-weight:900;font-size:13px;backdrop-filter:blur(4px)}
.probando{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--azulv);color:#fff;font-weight:900;border-radius:99px;padding:5px 14px;font-size:13px;z-index:2;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.bocadillo{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 14px;font-weight:900;z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.2);animation:boca 2.4s forwards;white-space:nowrap;font-size:15px}
.bocadillo::after{content:"";position:absolute;left:50%;bottom:-8px;border:9px solid transparent;border-top-color:#fff;border-bottom:0;transform:translateX(-50%)}
@keyframes boca{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.alias-f{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 2px}
.alias-f b{font:800 28px var(--f-tit)}
.alias-f button{border:0;background:var(--nube2);border-radius:50%;width:34px;height:34px;font-size:15px}
.nivel-c{padding:4px 10px 8px}
.nivel-c .fila-n{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:var(--tinta2);margin-bottom:5px}
.nivel-c .fila-n b{color:var(--tinta)}
.nivel-c .barra{height:16px}
.nivel-c .barra>i{background:linear-gradient(90deg,#8e5cf2,#2f8cff)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:var(--nube);border-radius:16px;padding:8px;text-align:center}
.stats b{display:block;font:800 22px var(--f-tit);line-height:1.1}
.stats small{font-weight:800;color:var(--tinta2);font-size:11.5px}
.der{min-width:0}
.tabs-al{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:6px;border-radius:20px;margin-bottom:16px}
.tabs-al button{flex:1;border:0;background:transparent;color:#dbe6ff;font-weight:800;padding:9px 6px;border-radius:15px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;position:relative}
.tabs-al .ic{font-size:22px;line-height:1.1}
.tabs-al button[aria-current=page]{background:#fff;color:var(--tinta)}
.salir-al{border:0;background:var(--nube2);color:var(--tinta);border-radius:12px;padding:7px 12px;font-weight:800;font-size:14px}
.son-al{border:0;background:var(--nube2);border-radius:12px;width:38px;height:36px;font-size:17px}
.bloque{background:#fff;border-radius:26px;padding:18px;box-shadow:var(--sombra);margin-bottom:16px}
.bloque h2{font-size:22px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.bloque h2 .esp{flex:1}
.saludo{color:#fff;margin:2px 0 14px}
.saludo h1{font-size:30px}
.saludo p{margin:2px 0 0;font-weight:700;opacity:.85}
.meta-al{display:flex;gap:14px;align-items:center}
.meta-al .m-ic{font-size:40px;width:64px;height:64px;border-radius:20px;background:#fff3e0;display:grid;place-items:center;flex:none}
.meta-al .barra{height:18px;margin-top:6px}
.meta-al b{font:800 18px var(--f-tit)}
.meta-al small{font-weight:800;color:var(--tinta2)}
.recs-al{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rec-al{background:var(--nube);border-radius:18px;padding:12px;text-align:center;font-weight:800;display:flex;flex-direction:column;gap:5px;align-items:center}
.rec-al .r-ic{font-size:34px}
.rec-al.ya{background:#e3f7ea;box-shadow:inset 0 0 0 2px #9fdcb5}
.rec-al small{font-size:12px;color:var(--tinta2)}
.lista-al{list-style:none;margin:0;padding:0}
.lista-al li{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--nube2)}
.lista-al li:last-child{border:0}
.lista-al .li-ic{width:42px;height:42px;border-radius:14px;background:var(--nube);display:grid;place-items:center;font-size:22px;flex:none}
.lista-al .li-t{flex:1;min-width:0}
.lista-al .li-t b{display:block}
.lista-al .li-t small{color:var(--tinta2);font-weight:700}
.lista-al .li-v{font:800 20px var(--f-tit);color:var(--verde)}
.lista-al .li-v.neg{color:var(--rojo)}.lista-al .li-v.canje{color:var(--naranja2)}

/* Taller */
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin-bottom:6px}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;min-height:42px;display:flex;align-items:center;gap:6px}
.cats button[aria-pressed=true]{background:#fff;color:var(--tinta)}
.cats .cnt{font-size:11px;background:rgba(0,0,0,.12);border-radius:99px;padding:1px 6px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:12px}
.item{border:0;background:#fff;border-radius:20px;padding:6px 6px 9px;box-shadow:0 4px 0 #cbd6f2,0 10px 20px rgba(10,26,70,.15);position:relative;color:var(--tinta);transition:transform .12s;text-align:center}
.item:hover{transform:translateY(-2px)}
.item .escena{aspect-ratio:1;border-radius:14px}
.item .escena .mon{position:absolute;left:8%;width:84%;bottom:0}
.item .escena .mon.zoom{left:0;width:100%;height:100%;top:0}
.item b{display:block;font-size:14.5px;margin:6px 0 4px;line-height:1.15}
.item[aria-pressed=true]{box-shadow:0 0 0 4px var(--azulv),0 4px 0 #cbd6f2}
.item.puesto{box-shadow:0 0 0 4px var(--naranja),0 4px 0 #cbd6f2}
.item.bloq .escena{filter:grayscale(.9) opacity(.7)}
.item .candado{position:absolute;top:10px;left:10px;background:var(--tinta);color:#fff;border-radius:99px;padding:2px 8px;font-size:12px;font-weight:900}
.item .chip{font-size:12.5px}
#compra{position:sticky;bottom:14px;z-index:20}
.barra-compra{margin-top:14px;background:#fff;border-radius:22px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.barra-compra .bc-t{flex:1;min-width:0}
.barra-compra .bc-t b{display:block;font:800 18px var(--f-tit)}
.barra-compra .bc-t small{font-weight:800;color:var(--tinta2)}
.coleccion{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;margin:2px 2px 10px}

/* Logros */
.logros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.logro{background:#fff;border-radius:20px;padding:14px 12px;text-align:center;box-shadow:var(--sombra2);position:relative}
.logro .l-ic{width:66px;height:66px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:radial-gradient(circle at 35% 30%,#fff6c9,#ffc21a);box-shadow:0 4px 0 #d99a00,inset 0 -4px 0 rgba(0,0,0,.08)}
.logro b{display:block;font:800 16px var(--f-tit)}
.logro small{display:block;font-weight:700;color:var(--tinta2);font-size:12.5px;margin:2px 0 8px}
.logro.no .l-ic{background:var(--nube2);box-shadow:none;filter:grayscale(1);opacity:.6}
.logro .barra{height:8px}
.colecc-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.colecc-cats div{display:grid;grid-template-columns:28px 1fr auto;gap:4px 8px;align-items:center;font-weight:800;font-size:14px}
.colecc-cats .barra{grid-column:2/4;height:8px}

/* Acceso */
.acceso{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.acceso-caja{background:#fff;border-radius:32px;padding:28px;width:min(430px,100%);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.acceso-caja h1{font-size:34px;margin:4px 0 2px}
.acceso-caja>p{color:var(--tinta2);font-weight:700;margin:0 0 18px}
.acceso-caja .campo{text-align:left}
.acceso-caja .campo input{font-size:20px;font-weight:800;min-height:54px;letter-spacing:.5px}
.trio{display:flex;justify-content:center;align-items:flex-end;height:150px;margin-top:-90px}
.trio .mon{width:120px;margin:0 -16px;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
.trio .mon:nth-child(2){width:156px;z-index:2}
.err-acc{background:var(--rojo2);color:#a32a2e;font-weight:800;border-radius:12px;padding:8px 12px;margin-bottom:12px}
.clave-w{position:relative}
.clave-w button{position:absolute;right:6px;bottom:6px;border:0;background:var(--nube2);border-radius:10px;width:42px;height:42px;font-size:18px}
.recordar{display:flex;gap:8px;align-items:flex-start;text-align:left;font-weight:700;font-size:14px;color:var(--tinta2);margin:4px 0 16px;cursor:pointer}
.recordar input{width:20px;height:20px;accent-color:var(--naranja);flex:none;margin-top:1px}
.entrar{width:100%;font-size:19px;min-height:56px}

/* Subida de nivel */
.subida{text-align:center}
.subida .escena{width:200px;aspect-ratio:4/5;border-radius:26px;margin:0 auto}
.subida .escena .mon{position:absolute;left:5%;width:90%;bottom:0}
.subida h2{font-size:32px;margin:12px 0 4px}
.nuevas{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}

@media(max-width:860px){
 .al{grid-template-columns:1fr;padding:0 0 92px;gap:0}
 .izq{position:relative;top:0;z-index:5}
 .tarjeta-mon{border-radius:0 0 30px 30px;padding:10px 12px 12px}
 .escenario{aspect-ratio:auto;height:44vh;min-height:270px;max-height:460px}
 .escenario>.mon{left:50%;width:auto;height:100%;transform:translateX(-50%)}
 .der{padding:14px 12px 0}
 .tabs-al{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-radius:22px 22px 0 0;margin:0;padding:6px 8px max(8px,env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(15,37,87,.2)}
 .tabs-al button{color:var(--tinta2);font-size:12px}
 .tabs-al button[aria-current=page]{background:#fff3e6;color:var(--naranja2)}
 body.en-taller .izq{position:sticky;top:0}
 body.en-taller .escenario{height:30vh;min-height:200px}
 body.en-taller .alias-f,body.en-taller .nivel-c,body.en-taller .stats,body.en-taller .top-al{display:none}
 body.en-taller .tarjeta-mon{padding:8px 10px 10px}
 #compra{bottom:84px}
 #toasts{bottom:calc(92px + env(safe-area-inset-bottom))}
 .items{grid-template-columns:repeat(3,1fr);gap:9px}
 .item b{font-size:13px}
 .saludo h1{font-size:26px}
}
@media(max-width:380px){.items{grid-template-columns:repeat(2,1fr)}}

  /* ---------- Patrones (recortados al cuerpo, sin tapar la cara) ---------- */
  function patron(tipo, s, g) {
    if (tipo === 'ninguno') return '';
    const r = rng(tipo.length * 977 + 13), out = [], face = (x, y) => ((x - 100) / 52) ** 2 + ((y - (g.fy + 18)) / 44) ** 2 < 1;
    const c = s.claro ? mix(s.col, 0, .28) : mix(s.col, 255, .5), op = s.claro ? .45 : .6;
    if (tipo === 'rayas') {
      for (let y = g.t + 6; y < 200; y += 17) out.push(`<path d="M10 ${y}q45 -9 90 0t90 0" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="round"/>`);
      return `<g opacity="${op}" mask="url(#mk${s.u})">${out.join('')}</g>`;
    }
    if (tipo === 'escamas') {
      for (let y = g.fy + 30; y < 200; y += 12) for (let x = 20 + ((y / 12) % 2) * 9; x < 190; x += 18) if (!face(x, y)) out.push(`<path d="M${x - 9} ${y}a9 9 0 0 0 18 0" stroke="${c}" stroke-width="2.5" fill="none"/>`);
      return `<g opacity="${op + .1}">${out.join('')}</g>`;
    }
    for (let i = 0; i < 70 && out.length < 14; i++) {
      const x = 22 + r() * 156, y = g.t + 8 + r() * (190 - g.t), sz = 5 + r() * 6;
      if (face(x, y) || out.some(o => Math.hypot(o.x - x, o.y - y) < 22)) continue;
      out.push({ x, y, sz, a: r() * 360 });
    }
    return `<g fill="${c}" opacity="${op}">${out.map(o => {
      if (tipo === 'lunares') return `<circle cx="${f1(o.x)}" cy="${f1(o.y)}" r="${f1(o.sz * .9)}"/>`;

      if (tipo === 'estrellas') return `<polygon points="${star(o.x, o.y, o.sz * 1.15)}" transform="rotate(${f1(o.a / 6)} ${f1(o.x)} ${f1(o.y)})"/>`;
      return `<path transform="translate(${f1(o.x)} ${f1(o.y)}) scale(${f1(o.sz * 2.1)}) rotate(${f1(o.a / 8 - 20)})" d="${HEART}"/>`;
    }).join('')}</g>`;
  }

  const M = { 'auth/invalid-credential': 'Usuario o clave incorrectos.', 'auth/wrong-password': 'Usuario o clave incorrectos.', 'auth/user-not-found': 'Usuario o clave incorrectos.', 'auth/invalid-email': 'Ese usuario no es válido.', 'auth/too-many-requests': 'Demasiados intentos. Espera un momento y vuelve a probar.', 'auth/network-request-failed': 'Sin conexión a internet. Revisa la red.', 'auth/popup-closed-by-user': 'Has cerrado la ventana de Google antes de terminar.', 'auth/unauthorized-domain': 'Este dominio no está autorizado en Firebase (Authentication → Configuración → Dominios autorizados).', 'permission-denied': 'No tienes permiso para hacer esto.', 'unavailable': 'Sin conexión con el servidor. Se reintentará al volver la red.' };
  return M[c] || (e && e.message) || 'Algo ha fallado.';
}

/* ===== Capa de datos: Firebase o modo demostración ===== */
const FB_VER = '12.6.0';
const ahora = () => Date.now();
const limpiaUsuario = u => (u || '').toString().trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9._-]/g, '');
const nuevoAlumnoDoc = (a, clase) => ({ usuario: a.usuario, clave: a.clave, nombre: a.nombre, clase, pts: 0, total: 0, neg: 0, cfg: Mon.aleatorio(), own: [], alias: Mon.nombreAzar(), ult: [], cnt: {}, creado: ahora() });
// Entrada del historial corto que ve el alumno
const entradaUlt = m => ({ id: m.id, t: m.t, n: m.n, ic: m.ic, v: m.v, tipo: m.tipo });
const ULT_MAX = 25;

/* ---------- Modo demostración (localStorage) ---------- */
function crearDemo() {

    const nombresB = ['Paula Vega', 'Raúl Castro', 'Sara Ortiz', 'Tomás León', 'Valeria Ramos', 'Yassin Amrani', 'Zoe Molina', 'Pablo Rubio'];
    const clase = (id, nombre, lista) => {

        const t = ahora() - Math.floor(Math.random() * 28 * 864e5);
        aplicaMov(d, id, al, { id: uid(), t, alumno: al, h: h.id, n: h.n, ic: h.ic, v: h.v, tipo: 'punto', maestro: 'demo-admin', mn: 'Manuel (demo)' });

    return d;
  }
  function aplicaMov(d, claseId, al, m) {
    const a = d.alumnos[al], c = d.clases[claseId];
    if (m.tipo === 'canje') a.pts -= m.coste;
    else { if (m.v > 0 || c.restar) a.pts += m.v; if (m.v > 0) { a.total += m.v; if (c.meta) c.meta.prog += m.v; } else a.neg += -m.v; a.cnt = a.cnt || {}; a.cnt[m.h] = (a.cnt[m.h] || 0) + 1; }
    c.movs.unshift(m); a.ult.unshift(entradaUlt(m)); a.ult = a.ult.slice(0, ULT_MAX);
  }
  const cargar = () => { try { D = JSON.parse(localStorage.getItem(KEY)); } catch (e) { } if (!D || !D.sistema) { D = semilla(); guardar(false); } };
  const guardar = (avisar = true) => { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { } if (avisar) subs.forEach(f => f()); };
  window.addEventListener('storage', e => { if (e.key === KEY) { cargar(); subs.forEach(f => f()); } });
  const sub = (fn) => { const f = () => { try { fn(); } catch (e) { console.error(e); } }; subs.add(f); setTimeout(f, 0); return () => subs.delete(f); };
  const copia = o => JSON.parse(JSON.stringify(o));

  return {
    modo: 'demo',
    async iniciar() { cargar(); },
    reiniciarDemo() { localStorage.removeItem(KEY); cargar(); subs.forEach(f => f()); },
    onAuth(cb) { authCb = cb; setTimeout(() => cb(usuarioSesion()), 0); },
    async entrarGoogle() { const u = { uid: 'demo-admin', email: 'admin@demo', nombre: 'Manuel (demo)', foto: '' }; sessionStorage.setItem(SES, JSON.stringify(u)); authCb && authCb(u); },
    async entrarAlumno(usuario, clave) {

    verMaestro(uid, cb) { return sub(() => cb(D.maestros[uid] ? { uid, ...copia(D.maestros[uid]) } : null)); },

    verClases(cb) { return sub(() => cb(Object.entries(D.clases).map(([id, c]) => { const { movs, ...r } = c; return { id, ...copia(r) }; }).sort((a, b) => a.nombre.localeCompare(b.nombre)))); },
    verClase(id, cb) { return sub(() => { const c = D.clases[id]; if (!c) return cb(null); const { movs, ...r } = c; cb({ id, ...copia(r) }); }); },
    verAlumnos(claseId, cb) { return sub(() => cb(Object.entries(D.alumnos).filter(([, a]) => claseId === '*' || a.clase === claseId).map(([uid, a]) => ({ uid, ...copia(a) })))); },
    verAlumno(uid, cb) { return sub(() => cb(D.alumnos[uid] ? { uid, ...copia(D.alumnos[uid]) } : null)); },
    verMovs(claseId, desde, cb) { return sub(() => cb(copia((D.clases[claseId]?.movs || []).filter(m => m.t >= desde)))); },
    async darPuntos({ clase, alumnos, hab, maestro, nota }) {
      const lote = [];
      alumnos.forEach(a => { const m = { id: uid(), t: ahora(), alumno: a.uid, h: hab.id, n: hab.n, ic: hab.ic, v: hab.v, tipo: 'punto', maestro: maestro.uid, mn: maestro.nombre }; if (nota) m.nota = nota; aplicaMov(D, clase.id, a.uid, m); lote.push(m); });
      guardar(); return lote;
    },
    async canjear({ clase, alumno, rec, maestro }) {
      if (D.alumnos[alumno.uid].pts < rec.p) throw new Error('Puntos insuficientes');
      const m = { id: uid(), t: ahora(), alumno: alumno.uid, h: rec.id, n: rec.n, ic: rec.ic, v: -rec.p, coste: rec.p, tipo: 'canje', maestro: maestro.uid, mn: maestro.nombre };
      aplicaMov(D, clase.id, alumno.uid, m); guardar(); return [m];
    },
    async deshacer(claseId, lote) {
      const c = D.clases[claseId];
      lote.forEach(m => {
        const a = D.alumnos[m.alumno]; if (!a) return;
        if (m.tipo === 'canje') a.pts += m.coste; else { if (m.v > 0 || c.restar) a.pts -= m.v; if (m.v > 0) { a.total -= m.v; if (c.meta) c.meta.prog = Math.max(0, c.meta.prog - m.v); } else a.neg -= -m.v; if (a.cnt && a.cnt[m.h]) a.cnt[m.h]--; }
        c.movs = c.movs.filter(x => x.id !== m.id); a.ult = a.ult.filter(x => x.id !== m.id);
      });
      guardar();
    },
    async guardarClase(id, datos) { Object.assign(D.clases[id], copia(datos)); guardar(); },
    async crearClase(nombre) { const id = 'c' + uid(); D.clases[id] = { nombre, habilidades: HAB_DEF.map(h => ({ ...h })), recompensas: REC_DEF.map(r => ({ ...r })), meta: { n: 'Fiesta de clase', obj: 200, prog: 0, ic: '🎉' }, restar: true, ausentes: { f: '', ids: [] }, grupos: [], creado: ahora(), movs: [] }; guardar(); return id; },
    async borrarClase(id) { delete D.clases[id]; Object.values(D.alumnos).forEach(a => { if (a.clase === id) a.clase = ''; }); guardar(); },
    async guardarMaestro(uid, datos) { Object.assign(D.maestros[uid], copia(datos)); guardar(); },
    async borrarMaestro(uid) { delete D.maestros[uid]; guardar(); },
    async importarAlumnos(claseId, lista, prog) {
      const res = { creados: 0, actualizados: 0, errores: [] };
      for (const [i, a] of lista.entries()) {
        await espera(40); prog && prog(i + 1, lista.length);
        const k = Object.keys(D.alumnos).find(k => D.alumnos[k].usuario === a.usuario);
        if (k) { if (D.alumnos[k].clave !== a.clave) { res.errores.push(a.usuario + ': ya existe con otra clave'); continue; } Object.assign(D.alumnos[k], { nombre: a.nombre, clase: claseId }); res.actualizados++; }
        else { D.alumnos['demo-' + uid()] = nuevoAlumnoDoc(a, claseId); res.creados++; }
      }
      guardar(); return res;
    },
    async actualizarAlumno(uid, datos) { Object.assign(D.alumnos[uid], copia(datos)); guardar(); },
    async cambiarClave(a, nueva) { D.alumnos[a.uid].clave = nueva; guardar(); },
    async borrarAlumno(a) { delete D.alumnos[a.uid]; guardar(); },
    async guardarCatalogo(mapas) { Object.assign(D.sistema, mapas); guardar(); },
    async reiniciar(claseId, todo) { Object.values(D.alumnos).forEach(a => { if (a.clase !== claseId) return; a.pts = 0; a.neg = 0; a.ult = []; a.cnt = {}; if (todo) { a.total = 0; a.own = []; a.cfg = Mon.aleatorio(); } }); D.clases[claseId].movs = []; if (D.clases[claseId].meta) D.clases[claseId].meta.prog = 0; guardar(); },
    async exportar() { return copia(D); },
    // alumnado
    async comprar(uidA, clave) {
      const a = D.alumnos[uidA], p = D.sistema.precios[clave], r = D.sistema.req[clave] || 0;
      if (p === undefined) throw new Error('Pieza desconocida'); if (a.own.includes(clave)) return;
      if (a.pts < p) throw new Error('Te faltan puntos'); if (a.total < r) throw new Error('Aún no tienes el nivel');
      a.pts -= p; a.own.push(clave); guardar();
    },
    async guardarAspecto(uidA, cfg) { D.alumnos[uidA].cfg = copia(cfg); guardar(); },
    async renombrar(uidA, alias) { D.alumnos[uidA].alias = alias; guardar(); }
  };
}

/* ---------- Firebase ---------- */
function crearFirebase(cfg) {
  let A, F, app, auth, db, app2, auth2, authCb = null;
  const DOM = (typeof DOMINIO_ALUMNOS !== 'undefined' ? DOMINIO_ALUMNOS : 'alumnos.siurot.net');
  const email = u => limpiaUsuario(u) + '@' + DOM;
  const snapLista = s => s.docs.map(d => ({ uid: d.id, id: d.id, ...d.data() }));
  async function auxiliar() { // segunda instancia para crear cuentas sin cerrar la sesión del maestro
    if (!auth2) { app2 = A.initializeApp(cfg, 'altas'); auth2 = A.getAuth(app2); await A.setPersistence(auth2, A.inMemoryPersistence); }
    return auth2;
  }
  async function uidDe(a) { // inicia sesión con las credenciales del alumno en la instancia auxiliar
    const au = await auxiliar(); const r = await A.signInWithEmailAndPassword(au, email(a.usuario), a.clave); return { au, user: r.user };
  }
  const lote = () => F.writeBatch(db);
  const inc = n => F.increment(n);
  const api = {
    modo: 'firebase',
    async iniciar() {
      const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
      const [m1, m2, m3] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      A = { ...m1, ...m2 }; F = m3;
      app = A.initializeApp(cfg); auth = A.getAuth(app);
      const cache = typeof CACHE_LOCAL !== 'undefined' && CACHE_LOCAL;
      try { db = cache ? F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) }) : F.getFirestore(app); } catch (e) { db = F.getFirestore(app); }
      auth.languageCode = 'es';
    },
    onAuth(cb) { authCb = cb; A.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email, nombre: u.displayName || u.email, foto: u.photoURL || '' } : null)); },
    async entrarGoogle() {
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      try { await A.signInWithPopup(auth, p); } catch (e) { if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') await A.signInWithRedirect(auth, p); else throw e; }
    },
    async entrarAlumno(usuario, clave, recordar) {
      await A.setPersistence(auth, recordar ? A.browserLocalPersistence : A.browserSessionPersistence);
      await A.signInWithEmailAndPassword(auth, email(usuario), clave.trim());
    },
    async salir() { await A.signOut(auth); },
    async perfilMaestro(uid) { const s = await F.getDoc(F.doc(db, 'maestros', uid)); return s.exists() ? { uid, ...s.data() } : null; },
    async solicitarAcceso(u) {
      const sis = await F.getDoc(F.doc(db, 'sistema', 'config'));
      if (!sis.exists()) { // primer acceso: esta persona se convierte en administradora
        const { precios, req } = Mon.mapas();
        await F.setDoc(F.doc(db, 'sistema', 'config'), { admin: u.uid, precios, req, centro: 'CEIP Manuel Siurot', creado: ahora() });
        await F.setDoc(F.doc(db, 'maestros', u.uid), { nombre: u.nombre, email: u.email, estado: 'activo', rol: 'admin', clases: [], creado: ahora() });
      } else {
        const ref = F.doc(db, 'maestros', u.uid), s = await F.getDoc(ref);
        if (!s.exists()) await F.setDoc(ref, { nombre: u.nombre, email: u.email, estado: 'pendiente', rol: 'maestro', clases: [], creado: ahora() });
      }
      return this.perfilMaestro(u.uid);
    },
    verSistema(cb, err) { return F.onSnapshot(F.doc(db, 'sistema', 'config'), s => cb(s.exists() ? s.data() : null), err); },
    verMaestro(uid, cb, err) { return F.onSnapshot(F.doc(db, 'maestros', uid), s => cb(s.exists() ? { uid, ...s.data() } : null), err); },
    verMaestros(cb, err) { return F.onSnapshot(F.collection(db, 'maestros'), s => cb(snapLista(s)), err); },
    verClases(cb, err) { return F.onSnapshot(F.collection(db, 'clases'), s => cb(snapLista(s).sort((a, b) => a.nombre.localeCompare(b.nombre))), err); },
    verClase(id, cb, err) { return F.onSnapshot(F.doc(db, 'clases', id), s => cb(s.exists() ? { id, ...s.data() } : null), err); },
    verAlumnos(claseId, cb, err) { const q = claseId === '*' ? F.collection(db, 'alumnos') : F.query(F.collection(db, 'alumnos'), F.where('clase', '==', claseId)); return F.onSnapshot(q, s => cb(snapLista(s)), err); },
    verAlumno(uid, cb, err) { return F.onSnapshot(F.doc(db, 'alumnos', uid), s => cb(s.exists() ? { uid, ...s.data() } : null), err); },
    verMovs(claseId, desde, cb, err) { const q = F.query(F.collection(db, 'clases', claseId, 'movs'), F.where('t', '>=', desde), F.orderBy('t', 'desc'), F.limit(4000)); return F.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), err); },
    async darPuntos({ clase, alumnos, hab, maestro, nota }) {
      const b = lote(), out = []; let pos = 0;
      alumnos.forEach(a => {
        const ref = F.doc(F.collection(db, 'clases', clase.id, 'movs'));
        const m = { id: ref.id, t: ahora(), alumno: a.uid, h: hab.id, n: hab.n, ic: hab.ic, v: hab.v, tipo: 'punto', maestro: maestro.uid, mn: maestro.nombre }; if (nota) m.nota = nota;
        const { id, ...guardado } = m; b.set(ref, guardado);
        const up = { ult: [entradaUlt(m), ...(a.ult || [])].slice(0, ULT_MAX) };
        if (hab.v > 0 || clase.restar) up.pts = inc(hab.v);
        if (hab.v > 0) { up.total = inc(hab.v); pos += hab.v; } else up.neg = inc(-hab.v);
        up['cnt.' + hab.id] = inc(1);
        b.update(F.doc(db, 'alumnos', a.uid), up); out.push(m);
      });
      if (pos && clase.meta) b.update(F.doc(db, 'clases', clase.id), { 'meta.prog': inc(pos) });
      await b.commit(); return out;
    },
    async canjear({ clase, alumno, rec, maestro }) {
      const ref = F.doc(F.collection(db, 'clases', clase.id, 'movs')), aRef = F.doc(db, 'alumnos', alumno.uid);
      const m = { id: ref.id, t: ahora(), alumno: alumno.uid, h: rec.id, n: rec.n, ic: rec.ic, v: -rec.p, coste: rec.p, tipo: 'canje', maestro: maestro.uid, mn: maestro.nombre };
      await F.runTransaction(db, async tx => {
        const s = await tx.get(aRef); const d = s.data(); if ((d.pts || 0) < rec.p) throw new Error('Puntos insuficientes');
        const { id, ...g } = m; tx.set(ref, g); tx.update(aRef, { pts: inc(-rec.p), ult: [entradaUlt(m), ...(d.ult || [])].slice(0, ULT_MAX) });
      });
      return [m];
    },
    async deshacer(claseId, lista, clase, alumnosActuales) {
      const b = lote(); let pos = 0; const por = {};
      lista.forEach(m => { (por[m.alumno] = por[m.alumno] || []).push(m); b.delete(F.doc(db, 'clases', claseId, 'movs', m.id)); });
      Object.entries(por).forEach(([uid, ms]) => {
        const a = alumnosActuales.find(x => x.uid === uid); if (!a) return;
        let p = 0, t = 0, n = 0; ms.forEach(m => { if (m.tipo === 'canje') p += m.coste; else { if (m.v > 0 || clase.restar) p -= m.v; if (m.v > 0) { t -= m.v; pos += m.v; } else n -= -m.v; } });
        const ids = ms.map(m => m.id), up = { pts: inc(p), total: inc(t), neg: inc(n), ult: (a.ult || []).filter(x => !ids.includes(x.id)) };
        ms.forEach(m => { if (m.tipo !== 'canje') up['cnt.' + m.h] = inc(-1); }); b.update(F.doc(db, 'alumnos', uid), up);
      });
      if (pos && clase.meta) b.update(F.doc(db, 'clases', claseId), { 'meta.prog': inc(-pos) });
      await b.commit();
    },
    async guardarClase(id, datos) { await F.updateDoc(F.doc(db, 'clases', id), datos); },
    async crearClase(nombre) { const ref = F.doc(F.collection(db, 'clases')); await F.setDoc(ref, { nombre, habilidades: HAB_DEF, recompensas: REC_DEF, meta: { n: 'Fiesta de clase', obj: 200, prog: 0, ic: '🎉' }, restar: true, ausentes: { f: '', ids: [] }, grupos: [], creado: ahora() }); return ref.id; },
    async borrarClase(id) {

      let b = lote(), n = 0; const enviar = async () => { await b.commit(); b = lote(); n = 0; };
      for (const d of s.docs) { b.update(d.ref, { clase: '' }); if (++n >= 400) await enviar(); }
      for (const d of (await F.getDocs(F.collection(db, 'clases', id, 'movs'))).docs) { b.delete(d.ref); if (++n >= 400) await enviar(); }

      for (const [i, a] of lista.entries()) {

          let uid;
          try { uid = (await A.createUserWithEmailAndPassword(au, email(a.usuario), a.clave)).user.uid; }
          catch (e) {

          else { await F.setDoc(ref, nuevoAlumnoDoc(a, claseId)); res.creados++; }
        } catch (e) {
          const msg = e.code === 'auth/too-many-requests' ? 'demasiados intentos seguidos; espera unos minutos y vuelve a importar' : e.code === 'auth/weak-password' ? 'la clave debe tener al menos 6 caracteres' : (e.message || e.code);
          res.errores.push(a.usuario + ': ' + msg);

    async reiniciar(claseId, todo) {
      const s = await F.getDocs(F.query(F.collection(db, 'alumnos'), F.where('clase', '==', claseId)));
      let b = lote(), n = 0; const enviar = async () => { await b.commit(); b = lote(); n = 0; };

      const ms = await F.getDocs(F.collection(db, 'clases', claseId, 'movs'));
      for (const d of ms.docs) { b.delete(d.ref); if (++n >= 400) await enviar(); }
      const cd = await F.getDoc(F.doc(db, 'clases', claseId)); if (cd.exists() && cd.data().meta) b.update(F.doc(db, 'clases', claseId), { 'meta.prog': 0 }); await enviar();
    },
    async exportar() {
      const out = { exportado: new Date().toISOString(), maestros: {}, clases: {}, alumnos: {} };
      (await F.getDocs(F.collection(db, 'maestros'))).docs.forEach(d => out.maestros[d.id] = d.data());
      (await F.getDocs(F.collection(db, 'alumnos'))).docs.forEach(d => out.alumnos[d.id] = d.data());
      for (const d of (await F.getDocs(F.collection(db, 'clases'))).docs) { out.clases[d.id] = d.data(); out.clases[d.id].movs = (await F.getDocs(F.collection(db, 'clases', d.id, 'movs'))).docs.map(x => ({ id: x.id, ...x.data() })); }

    async comprar(uidA, clave) {

      const p = sis.data().precios[clave], r = (sis.data().req || {})[clave] || 0;

    },
    async guardarAspecto(uidA, cfg) { await F.updateDoc(F.doc(db, 'alumnos', uidA), { cfg }); },
    async renombrar(uidA, alias) { await F.updateDoc(F.doc(db, 'alumnos', uidA), { alias }); }
  };
  return api;
}

    const id = it[0], t = tiene(k, id), pu = y.cfg[k] === id, bl = bloqueado(k, id), pr = precio(k, id), prob = A.prueba && A.prueba.k === k && A.prueba.id === id;
    const chip = pu ? '<span class="chip ok">✓ Puesto</span>' : t ? '<span class="chip">Tuyo</span>' : bl ? `<span class="chip">Nivel ${Mon.nivel(reqTotal(k, id))}</span>` : `<span class="chip ${y.pts >= pr ? 'oro' : 'mal'}">⭐ ${pr}</span>`;
    return `<button class="item ${pu ? 'puesto' : ''} ${bl ? 'bloq' : ''}" data-id="${id}" aria-pressed="${!!prob}" aria-label="${esc(it[1])}">${bl ? '<span class="candado">🔒</span>' : ''}<div class="escena">${Mon.fondo(k === 'fondo' ? id : y.cfg.fondo)}${Mon.svg({ ...y.cfg, [k]: id }, { anim: false, vb: Mon.encuadre(y.cfg, k) })}</div><b>${esc(it[1])}</b>${chip}</button>`;
  }).join('')}</div><div id="compra"></div>`);
  const cats = $('#cats');
  if (scrollCats !== null) { cats.scrollLeft = scrollCats; window.scrollTo(0, scrollY); }
  else centrarCategoria(cats, false);
  $$('#cats button').forEach(b => b.onclick = () => { A.cat = b.dataset.k; if (A.prueba) { A.prueba = null; pintarLado(); } tTaller(c); centrarCategoria($('#cats'), true); });
  $('#items').onclick = e => { const b = e.target.closest('.item'); if (b) elegirPieza(A.cat, b.dataset.id); };
  pintarCompra();
}
// Desplaza solo la barra de categorías (no la página) para que la elegida quede a la vista
function centrarCategoria(cats, suave) {
  const b = cats && cats.querySelector(`[data-k="${A.cat}"]`); if (!b) return;
  const izq = b.offsetLeft - cats.offsetLeft, dest = izq - (cats.clientWidth - b.offsetWidth) / 2;
  const fuera = izq < cats.scrollLeft || izq + b.offsetWidth > cats.scrollLeft + cats.clientWidth;
  if (!suave || fuera) cats.scrollTo({ left: Math.max(0, dest), behavior: suave ? 'smooth' : 'auto' });
}
function elegirPieza(k, id) {
  const y = A.yo;
  if (tiene(k, id)) {
    A.prueba = null;
    if (y.cfg[k] !== id) { const nuevo = cfgSegura({ ...y.cfg, [k]: id }); A.yo.cfg = nuevo; Datos.guardarAspecto(y.uid, nuevo).catch(errA); Sonido.tocar('pop'); }
    pintarLado(); if (A.tab === 'taller') tTaller($('#cont')); animar($('#esc'), 'salta'); return;
  }
  A.prueba = { k, id }; pintarLado(); if (A.tab === 'taller') tTaller($('#cont')); else pintarCompra(); animar($('#esc'), 'saluda'); Sonido.tocar('tic');
}
function pintarCompra() {
  const z = $('#compra'); if (!z) return; if (!A.prueba) return z.innerHTML = '';
  const { k, id } = A.prueba, it = Mon.item(k, id), pr = precio(k, id), y = A.yo, bl = bloqueado(k, id);
  let txt, btn;
  if (bl) { const r = reqTotal(k, id), lv = Mon.nivel(r); txt = `<b>${esc(it[1])}</b><small>Se desbloquea en el nivel ${lv}. Te faltan ${pila(r - (y.total || 0), 'estrella ganada', 'estrellas ganadas')}.</small>`; btn = '<button class="btn pri" disabled>🔒 Bloqueado</button>'; }
  else if (y.pts < pr) { txt = `<b>${esc(it[1])} · ⭐ ${pr}</b><small>Te faltan ${pila(pr - y.pts, 'estrella', 'estrellas')}. ¡Sigue así!</small>`; btn = `<button class="btn pri" disabled>Faltan ${pr - y.pts} ⭐</button>`; }
  else { txt = `<b>${esc(it[1])} · ⭐ ${pr}</b><small>Te quedarán ${pila(y.pts - pr, 'estrella', 'estrellas')}</small>`; btn = `<button class="btn pri" id="comprar">Comprar</button>`; }
  z.innerHTML = `<div class="barra-compra"><button class="btn icono sec" id="quitar" aria-label="Quitar prueba">✕</button><div class="bc-t">${txt}</div>${btn}</div>`;
  $('#quitar').onclick = () => { A.prueba = null; pintarLado(); tTaller($('#cont')); };
  $('#comprar') && ($('#comprar').onclick = comprar);
}
async function comprar() {
  const { k, id } = A.prueba, it = Mon.item(k, id), pr = precio(k, id), b = $('#comprar');
  b.disabled = true; b.textContent = 'Comprando…';
  try {
    await Datos.comprar(A.yo.uid, clave(k, id));
    if (!(A.yo.own || []).includes(clave(k, id))) A.yo.own = [...(A.yo.own || []), clave(k, id)];
    const nuevo = cfgSegura({ ...A.yo.cfg, [k]: id }); A.yo.cfg = nuevo; A.prueba = null;
    await Datos.guardarAspecto(A.yo.uid, nuevo);
    Sonido.tocar('compra'); const r = $('#esc').getBoundingClientRect(); confeti(130, { x: r.left + r.width / 2, y: r.top + r.height / 2 });
    pintarLado(); tTaller($('#cont')); animar($('#esc'), 'salta'); decir('¡Me encanta! 😍');
    toast(`¡Conseguido: ${it[1]}!`, { ic: '🎉', tipo: 'ok' });
  } catch (e) { errA(e); b.disabled = false; b.textContent = 'Comprar'; }
}

/* ---------- Logros ---------- */
function logros() {
  const y = A.yo, tot = y.total || 0, own = (y.own || []).length, lv = Mon.nivel(tot);
  const deCat = k => Mon.CAT[k].i.filter(it => tiene(k, it[0])).length;
  const estilo = Mon.ORDEN.filter(k => k !== 'fondo' && y.cfg[k] && y.cfg[k] !== Mon.BASE[k]).length;
  return [
    ['⭐', 'Primera estrella', 'Consigue tu primer punto', tot, 1], ['🌟', 'En marcha', 'Gana 25 estrellas', tot, 25], ['💫', 'Imparable', 'Gana 100 estrellas', tot, 100], ['🏆', 'Superestrella', 'Gana 250 estrellas', tot, 250], ['👑', 'Leyenda del aula', 'Gana 500 estrellas', tot, 500],
    ['🛍️', 'Primera compra', 'Compra tu primera pieza', own, 1], ['🎒', 'Coleccionista', 'Consigue 10 piezas', own, 10], ['💎', 'Gran coleccionista', 'Consigue 25 piezas', own, 25],
    ['🎨', 'Paleta completa', 'Consigue todos los colores', deCat('color'), Mon.CAT.color.i.length], ['🗺️', 'Viajero', 'Consigue 5 fondos', deCat('fondo'), 5], ['🐣', 'Con compañía', 'Adopta una mascota', deCat('mascota') - 1, 1],
    ['🐷', 'Ahorrador', 'Junta 100 estrellas sin gastarlas', y.pts, 100], ['😎', 'Con estilo', 'Lleva piezas de 6 categorías a la vez', estilo, 6], ['🚀', 'Nivel 5', 'Llega al nivel 5', lv, 5], ['🛸', 'Nivel 10', 'Llega al nivel 10', lv, 10]
  ].map(([ic, n, d, v, obj]) => ({ ic, n, d, v: Math.max(0, v), obj, ok: v >= obj }));
}
function tLogros(c) {
  const L = logros(), hechos = L.filter(l => l.ok).length;
  html(c, `<div class="saludo"><h1>Tus logros</h1><p>Has conseguido ${hechos} de ${L.length}</p></div>
  <div class="logros">${L.sort((a, b) => b.ok - a.ok).map(l => `<div class="logro ${l.ok ? '' : 'no'}"><div class="l-ic">${l.ic}</div><b>${esc(l.n)}</b><small>${esc(l.d)}</small>${l.ok ? '<span class="chip ok">✓ Conseguido</span>' : `<div class="barra"><i style="width:${Math.min(100, l.v / l.obj * 100)}%"></i></div><small style="margin:4px 0 0">${Math.min(l.v, l.obj)} / ${l.obj}</small>`}</div>`).join('')}</div>
  <div class="bloque" style="margin-top:16px"><h2>🧩 Tu colección</h2><div class="colecc-cats">${Mon.ORDEN.map(k => { const l = Mon.CAT[k].i, t = l.filter(it => tiene(k, it[0])).length; return `<div><span>${Mon.CAT[k].ic}</span><span>${Mon.CAT[k].n}</span><span>${t}/${l.length}</span><div class="barra"><i style="width:${t / l.length * 100}%"></i></div></div>`; }).join('')}</div></div>`);
}

/* ---------- Historial ---------- */
function tHistorial(c) {
  const u = A.yo.ult || [], sem = u.filter(m => m.tipo !== 'canje' && m.v > 0 && Date.now() - m.t < 7 * 864e5).reduce((s, m) => s + m.v, 0);
  html(c, `<div class="saludo"><h1>Tu historial</h1><p>Esta semana has ganado ${pila(sem, 'estrella', 'estrellas')}</p></div><div class="bloque">${u.length ? `<ul class="lista-al">${u.map(filaUlt).join('')}</ul>` : '<div class="vacio"><b>Aún no hay nada</b>Aquí verás las estrellas que te den en clase.</div>'}</div>`);
}

/* ---------- Monstruo interactivo ---------- */
function decir(t) { const e = $('#esc'); if (!e) return; e.querySelector('.bocadillo')?.remove(); const b = document.createElement('div'); b.className = 'bocadillo'; b.textContent = t; e.append(b); setTimeout(() => b.remove(), 2500); }
function tocarMonstruo() { animar($('#esc'), Math.random() < .5 ? 'salta' : 'saluda'); Sonido.tocar('pop'); decir(FRASES[Math.floor(Math.random() * FRASES.length)]); }
async function renombrar() {
  const n = await pedir('Nombre de tu monstruo', { valor: A.yo.alias || '', etiqueta: 'Máximo 14 letras', max: 14, validar: v => !v ? 'Escribe un nombre' : '' });
  if (!n || n === A.yo.alias) return;
  A.yo.alias = n; pintarLado(); decir(`¡Me llamo ${n}!`);
  Datos.renombrar(A.yo.uid, n).catch(errA);
}

/* ---------- Novedades en directo y bienvenida ---------- */
const KV = () => 'aulasiurot_visto_' + A.user.uid;
function bienvenida() {
  let previo = null; try { previo = JSON.parse(localStorage.getItem(KV())); } catch (e) { }
  const y = A.yo, ahora_ = { t: Date.now(), lv: Mon.nivel(y.total || 0) };
  localStorage.setItem(KV(), JSON.stringify(ahora_));
  if (!previo) { setTimeout(() => decir(`¡Hola! Soy ${y.alias || 'tu monstruo'}`), 600); return; }
  const nuevos = (y.ult || []).filter(m => m.t > previo.t && m.tipo !== 'canje');
  const gan = nuevos.filter(m => m.v > 0).reduce((s, m) => s + m.v, 0);
  if (ahora_.lv > previo.lv) return setTimeout(() => subirNivel(previo.lv, ahora_.lv), 500);
  if (gan > 0) setTimeout(() => { Sonido.tocar('tada'); confeti(90); animar($('#esc'), 'salta'); decir(`¡Has ganado ${gan} ⭐!`); toast(`Mientras no estabas: +${gan} estrellas`, { ic: '🌟', tipo: 'ok', ms: 4000 }); }, 600);
  else setTimeout(() => decir('¡Qué alegría verte!'), 600);
}
function novedades(ant, y) {
  const conocidas = new Set((ant.ult || []).map(m => m.id));
  const nuevos = (y.ult || []).filter(m => !conocidas.has(m.id));
  const lvA = Mon.nivel(ant.total || 0), lvN = Mon.nivel(y.total || 0);
  nuevos.reverse().forEach((m, i) => setTimeout(() => {
    if (m.tipo === 'canje') { toast(`Has canjeado: ${m.n}`, { ic: m.ic }); return; }
    const e = $('#esc');
    if (m.v > 0) { Sonido.tocar('pos'); animar(e, 'salta'); burbuja(e, '+' + m.v, 'oro'); decir(m.n + ' ' + (m.ic || '')); $('.pill-pts')?.classList.add('sube'); setTimeout(() => $('.pill-pts')?.classList.remove('sube'), 700); }
    else { Sonido.tocar('neg'); animar(e, 'triste'); burbuja(e, String(m.v), 'neg'); decir('¡La próxima vez lo harás genial!'); toast(`Tu maestro ha anotado: ${m.n}`, { ic: m.ic }); }
  }, i * 900));
  if (lvN > lvA) setTimeout(() => subirNivel(lvA, lvN), nuevos.length * 900 + 300);
  try { localStorage.setItem(KV(), JSON.stringify({ t: Date.now(), lv: lvN })); } catch (e) { }
}
function subirNivel(de, a) {
  const nuevas = []; Mon.ORDEN.forEach(k => Mon.CAT[k].i.forEach(it => { const lv = Mon.nivel(reqTotal(k, it[0])); if (reqTotal(k, it[0]) && lv > de && lv <= a) nuevas.push(`${Mon.CAT[k].ic} ${it[1]}`); }));
  Sonido.tocar('nivel'); confeti(220);
  modal({ titulo: '', clase: 'pequeña', cuerpo: `<div class="subida"><div class="escena">${Mon.fondo(A.yo.cfg.fondo)}${Mon.svg({ ...A.yo.cfg, efecto: 'brillos' })}</div><h2>¡Nivel ${a}!</h2><p class="m-texto">Ahora eres <b>${Mon.NIVELES[a - 1][1]}</b>. ¡Enhorabuena!</p>${nuevas.length ? `<p style="font-weight:800;margin-bottom:4px">Nuevas piezas desbloqueadas:</p><div class="nuevas">${nuevas.map(n => `<span class="chip oro">${esc(n)}</span>`).join('')}</div>` : ''}</div>`, botones: [{ t: nuevas.length ? 'Ir al taller' : '¡Genial!', cls: 'pri', valor: nuevas.length ? 'taller' : true }] })
    .then(v => { if (v === 'taller') irTab('taller'); });
  setTimeout(() => animar($('.subida .escena'), 'salta'), 400);
}
